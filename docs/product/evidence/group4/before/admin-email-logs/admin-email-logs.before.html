<!doctype html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
  <meta charset="utf-8">
  <title>Cristal Water - Email Logs</title>
  <link rel="stylesheet" href="/ui/foundation.css">

  <style>
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e3f2fd;
      color: #1f2933;
    }

    header {
      background: white;
      border-bottom: 3px solid #1e88e5;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header img {
      height: 70px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      color: #1e88e5;
    }

    header p {
      margin: 4px 0 0 0;
      color: #555;
      font-size: 14px;
    }

    main {
      padding: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f5faff;
      color: #1e88e5;
      text-align: left;
    }

    tr:hover {
      background: #f0f8ff;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #555;
    }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body data-required-role="ADMIN">

<header>
  <img src="/logo.png" alt="Cristal Water">
  <div>
    <h1>Cristal Water</h1>
    <p>Email Logs · Administração</p>
  </div>
</header>

<main>

  <!-- FILTROS EXISTENTES -->
  <form id="filters">
    Status:
    <select id="status">
      <option value="">Todos</option>
      <option value="SENT">SENT</option>
      <option value="FAILED">FAILED</option>
    </select>

    Tipo:
    <input id="type" placeholder="ex: REPORT">

    Destinatário:
    <input id="recipient" placeholder="email">

    <button type="submit">Filtrar</button>
    <button type="button" id="clear">Limpar</button>
  </form>

  <br>

  <!-- TABELA -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Status</th>
        <th>Tipo</th>
        <th>Email</th>
        <th>Assunto</th>
        <th>Erro</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <p id="summary"></p>

</main>

<footer>
  © Cristal Water · Swimming Pools
</footer>

<script src="/admin-email-logs.js"></script>
<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
