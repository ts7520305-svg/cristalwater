<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<title>Cristal Water - Prioridades Operacionais</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#050b16;color:#e8f7ff}
main{max-width:1100px;margin:0 auto;padding:18px}
h2{margin:0 0 6px;font-size:28px}
.subtitle{margin:0 0 16px;color:#9db4c9}
#list{display:grid;gap:10px}
.card{background:rgba(255,255,255,.055);padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.2)}
.panel{border:1px solid rgba(53,217,255,.24);border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(16,32,54,.9),rgba(8,18,32,.95));box-shadow:0 24px 70px rgba(0,0,0,.38)}
select{padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#071829;color:#e8f7ff;margin-top:8px}
@media(max-width:700px){main{padding:14px}h2{font-size:24px}}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body data-required-role="ADMIN">

<div style="padding:12px 16px 0">
  <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
</div>

<main>
  <section class="panel" data-help-topic="pools">
    <h2>Prioridade das Piscinas</h2>
    <p class="subtitle">Classifica por impacto operacional sem alterar estrutura de dados.</p>
    <div id="list"></div>
  </section>
</main>

<script>
const API = "/api";

function authHeaders(extra = {}) {
  const token = localStorage.getItem("token") || localStorage.getItem("cristalwater_jwt");
  return {
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...extra,
  };
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// ==========================================================
// LOAD
// ==========================================================

async function load(){

  const res = await fetch(`${API}/pools`, { headers: authHeaders() });
  if (!res.ok) return;
  const pools = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  pools.forEach(p => {

    list.innerHTML += `
      <div class="card">
        <b>${escapeHtml(p.name)}</b><br>
        Cliente: ${escapeHtml(p.client?.name || "-")}

        <br><br>

        Prioridade:
        <select onchange="save(${p.id}, this.value)">
          <option value="0" ${p.priority==0?"selected":""}>Normal</option>
          <option value="1" ${p.priority==1?"selected":""}>Alta</option>
          <option value="2" ${p.priority==2?"selected":""}>Urgente</option>
        </select>
      </div>
    `;
  });
}

// ==========================================================
// SAVE
// ==========================================================

async function save(id, priority){

  await fetch(`${API}/pools/priority/${id}`,{
    method:"POST",
    headers: authHeaders({ "Content-Type":"application/json" }),
    body: JSON.stringify({ priority: Number(priority) })
  });

  console.log("✔ prioridade atualizada:", id, priority);
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script src="/ui/core/navigation-context.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
