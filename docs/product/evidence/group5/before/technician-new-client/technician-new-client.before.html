<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Cristal Water · Novo Cliente em Campo</title>
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#e8f7ff}header{position:sticky;top:0;background:rgba(7,17,31,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(56,189,248,.28);padding:16px;z-index:2}h1{font-size:22px;margin:0}p{color:#9fb2c7;line-height:1.45}.wrap{max-width:880px;margin:auto;padding:16px}.card{background:linear-gradient(180deg,rgba(18,34,58,.92),rgba(10,22,39,.98));border:1px solid rgba(56,189,248,.22);border-radius:22px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.32)}label{display:block;margin:12px 0 6px;font-weight:800}input,textarea,select{width:100%;border:1px solid rgba(148,163,184,.35);background:#0b1627;color:#e8f7ff;border-radius:14px;padding:13px;font-size:16px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#22c55e;color:#052e16}.secondary{background:#1f2937;color:#e8f7ff;border:1px solid rgba(255,255,255,.15)}.danger{background:#ef4444;color:white}.notice{padding:12px;border-radius:16px;margin:12px 0;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.32);color:#fde68a}.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.32);color:#bbf7d0}.hidden{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}button,a.btn{width:100%;text-align:center}.wrap{padding:10px}.card{border-radius:18px}}
  </style>
  <script src="/cw-auth.js"></script>
  <script src="/technician-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-cw-role="TECHNICIAN">
  <header><h1>➕ Novo cliente/piscina em campo</h1><p>Ficha provisória criada pelo técnico. O administrador valida e completa depois.</p></header>
  <main class="wrap">
    <div class="actions" style="margin-top:0;margin-bottom:10px;">
      <a class="btn secondary" href="/technician-field-mode">Voltar à ronda</a>
    </div>
    <section id="permissionBox" class="notice">A verificar permissões...</section>
    <form id="form" class="card hidden">
      <h2>Dados mínimos do cliente</h2>
      <div class="grid">
        <div><label>Nome do cliente *</label><input name="clientName" required placeholder="Ex: Villa Silva"></div>
        <div><label>Telefone</label><input name="phone" placeholder="+351 ..."></div>
        <div><label>Email</label><input name="email" type="email" placeholder="cliente@email.com"></div>
        <div><label>Zona</label><input name="zone" placeholder="Lagos, Aljezur, Portimão..."></div>
      </div>
      <label>Morada</label><input name="address" placeholder="Morada ou ponto de referência">
      <h2>Piscina</h2>
      <div class="grid">
        <div><label>Nome da piscina</label><input name="poolName" placeholder="Piscina principal"></div>
        <div><label>Tipo</label><select name="poolType"><option value="">Selecionar</option><option>Privada</option><option>Condomínio</option><option>Hotel</option><option>Jacuzzi</option></select></div>
        <div><label>Volume m³</label><input name="volumeM3" type="number" step="0.1" placeholder="ex: 75"></div>
        <div><label>GPS</label><button type="button" class="secondary" id="gpsBtn">📍 Usar localização atual</button></div>
      </div>
      <input type="hidden" name="latitude"><input type="hidden" name="longitude"><input type="hidden" name="technicianId" id="technicianId">
      <label>Notas rápidas</label><textarea name="notes" placeholder="Acesso, estado da piscina, problemas, fotos a tirar, pedido do cliente..."></textarea>
      <div class="actions"><button class="primary" type="submit">Guardar ficha provisória</button><a class="btn secondary" href="/technician-field-mode">Voltar à ronda</a></div>
      <p>Depois de guardares, o cliente/piscina fica pendente para validação do administrador.</p>
    </form>
    <section id="result" class="notice hidden"></section>
  </main>
  <script src="/cw-ui-feedback.js"></script>
  <script src="/technician-new-client.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
