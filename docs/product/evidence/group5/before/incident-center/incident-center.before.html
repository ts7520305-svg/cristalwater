<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/ui/foundation.css">
  <title>Cristal Water - Centro de Incidentes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:linear-gradient(120deg,#070f1f,#101f39 56%,#071126); color:#e9f5ff; }
    header { background:rgba(8,17,34,.95); border-bottom:1px solid rgba(255,107,107,.45); padding:18px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:999; backdrop-filter:blur(8px); }
    h1 { margin:0; font-size:24px; letter-spacing:-.01em; }
    .header-actions { display:flex; gap:8px; }
    .header-actions button, .topbar button { border:none; border-radius:12px; padding:11px 15px; background:#1f3f65; color:#e9f5ff; font-weight:700; cursor:pointer; }
    #logoutBtn { background:#6e1f2a; }
    main { max-width:1480px; margin:0 auto; padding:20px; }
    .topbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    #refreshBtn { background:linear-gradient(135deg,#0584c7,#35d1ff); color:#03121c; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:18px; }
    .card { background:rgba(13,29,49,.9); border:1px solid #24415f; border-radius:18px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.22); }
    .label { font-size:12px; color:#8fb1cc; text-transform:uppercase; margin-bottom:10px; }
    .value { font-size:34px; font-weight:800; }
    .red { color:#ff8a95; }
    .orange { color:#ffd166; }
    .blue { color:#7dc8ff; }
    .green { color:#81e6b3; }
    .layout { display:grid; grid-template-columns:1fr 2fr; gap:18px; }
    .panel { background:rgba(13,29,49,.92); border:1px solid #24415f; border-radius:18px; padding:18px; }
    .panel h2 { margin:0 0 12px; font-size:20px; }
    .incident { background:#0a1b2e; border-radius:14px; padding:16px; margin-bottom:14px; position:relative; border:1px solid rgba(143,177,204,.2); }
    .incident-critical { border-left:6px solid #ff6b6b; }
    .incident-high { border-left:6px solid #ffd166; }
    .incident-medium { border-left:6px solid #35d1ff; }
    .incident-low { border-left:6px solid #40e6a0; }
    .badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .badge { padding:6px 10px; border-radius:999px; font-size:11px; font-weight:700; color:#e9f5ff; border:1px solid rgba(143,177,204,.3); background:#10243c; }
    .badge-critical { background:rgba(255,107,107,.22); border-color:rgba(255,107,107,.45); }
    .badge-high { background:rgba(255,209,102,.2); border-color:rgba(255,209,102,.45); color:#fff0c2; }
    .badge-medium { background:rgba(53,209,255,.2); border-color:rgba(53,209,255,.45); }
    .badge-low { background:rgba(64,230,160,.2); border-color:rgba(64,230,160,.45); color:#d8ffee; }
    .badge-escalated { background:rgba(196,139,255,.2); border-color:rgba(196,139,255,.45); }
    .incident-meta { margin-top:12px; font-size:12px; color:#9fc6df; line-height:1.6; }
    .sla-container { margin-top:14px; }
    .sla-bar { width:100%; height:10px; background:#16314f; border-radius:999px; overflow:hidden; }
    .sla-progress { height:100%; width:0%; background:#40e6a0; }
    .incident-actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .incident-actions button { border:none; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700; }
    .btn-resolve { background:#1f7f52; color:#effff7; }
    .btn-escalate { background:#a73240; color:#ffeaf0; }
    .timeline-item { position:relative; padding-left:24px; margin-bottom:14px; color:#d6eeff; }
    .timeline-item::before { content:""; position:absolute; left:0; top:4px; width:12px; height:12px; border-radius:50%; background:#ff6b6b; }
    .timeline-time { font-size:12px; color:#8fb1cc; margin-top:5px; }
    @media (max-width:1000px) { .layout { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/cw-ui-kit.css">
  <link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">

  <div style="padding:12px 16px 0">
    <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
  </div>
  <header>
    <h1>Centro de Incidentes</h1>
    <div class="header-actions">
      <button id="logoutBtn" type="button">Sair</button>
    </div>
  </header>

  <main>
    <div class="topbar">
      <button id="refreshBtn" type="button">Atualizar</button>
      <button id="dashboardBtn" type="button">Dashboard</button>
    </div>

    <section class="grid" aria-label="Indicadores de incidentes">
      <article class="card">
        <div class="label">Criticos</div>
        <div id="criticalCount" class="value red">0</div>
      </article>
      <article class="card">
        <div class="label">Altos</div>
        <div id="highCount" class="value orange">0</div>
      </article>
      <article class="card">
        <div class="label">Ativos</div>
        <div id="activeCount" class="value blue">0</div>
      </article>
      <article class="card">
        <div class="label">Resolvidos</div>
        <div id="resolvedCount" class="value green">0</div>
      </article>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>Linha temporal de incidentes</h2>
        <div id="incidentTimeline" role="log" aria-live="polite"></div>
      </article>

      <article class="panel">
        <h2>Incidentes ativos</h2>
        <div id="incidentList" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script src="/admin-auth-guard.js"></script>
  <script src="/incident-center.js"></script>
  <script src="/cristal-help-data.js"></script>
  <script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
