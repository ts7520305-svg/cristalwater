<!doctype html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="utf-8">
<title>Cristal Water - Cobranças</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/ui/foundation.css">

<style>
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #1f2937;
}

/* HEADER */
.header {
  background: linear-gradient(135deg,#0f75bc,#1e88e5);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h2 {
  margin: 0;
}

.header a {
  color: white;
  text-decoration: none;
  background: rgba(255,255,255,0.2);
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: bold;
}

/* LAYOUT */
main {
  padding: 20px;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.toolbar input,
.toolbar button {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.toolbar button {
  background: #1e88e5;
  color: white;
  border: none;
  cursor: pointer;
}

/* SUMMARY */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.summary-card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary-card h4 {
  margin: 0;
  font-size: 12px;
  color: #6b7280;
}

.summary-card .value {
  font-size: 22px;
  font-weight: bold;
  margin-top: 6px;
}

/* CARDS CLIENTE */
.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.row {
  margin-bottom: 8px;
}

.badge {
  padding: 4px 8px;
  border-radius: 8px;
  color: white;
  font-size: 12px;
}

.paid { background: green; }
.partial { background: orange; }
.pending { background: red; }

.actions button {
  margin-right: 5px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.btn-green { background: green; color: white; }
.btn-blue { background: #1e88e5; color: white; }
.btn-grey { background: #6b7280; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body data-required-role="ADMIN">

<div class="header">
  <h2>💶 Cobranças</h2>
  <a href="/dashboard">⬅ Dashboard</a>
</div>

<main>

<div class="toolbar">
  <input type="month" id="monthRef" aria-label="Mes de referencia">
  <button onclick="loadBilling()">Atualizar</button>
  <button onclick="generateMonthly()">Gerar mensalidades</button>
</div>

<div id="status"></div>

<!-- RESUMO -->
<div class="summary">
  <div class="summary-card">
    <h4>Clientes</h4>
    <div id="totalClients" class="value">-</div>
  </div>

  <div class="summary-card">
    <h4>Piscinas</h4>
    <div id="totalPools" class="value">-</div>
  </div>

  <div class="summary-card">
    <h4>Faturado</h4>
    <div id="totalAmount" class="value">-</div>
  </div>

  <div class="summary-card">
    <h4>Recebido</h4>
    <div id="totalPaid" class="value">-</div>
  </div>

  <div class="summary-card">
    <h4>Em aberto</h4>
    <div id="totalOpen" class="value">-</div>
  </div>

  <div class="summary-card">
    <h4>% Recebido</h4>
    <div id="paidPercent" class="value">-</div>
  </div>
</div>

<div id="billingList"></div>

</main>

<script src="/billing.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
