<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mapa Técnicos - Cristal Water</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button onclick="loadMap()">Atualizar</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const API = "/api";

let map = L.map('map').setView([37.1, -8.6], 10);
let markers = [];

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

async function loadMap() {
  try {
    const res = await fetch(`${API}/gps/live`);
    const data = await res.json();

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    data.forEach(t => {
      const marker = L.marker([t.latitude, t.longitude]).addTo(map);

      marker.bindPopup(`
        <strong>${t.name}</strong><br>
        Atualizado: ${new Date(t.updatedAt).toLocaleTimeString()}
      `);

      markers.push(marker);
    });

  } catch (err) {
    console.error(err);
    alert("Erro ao carregar mapa");
  }
}

// auto refresh
setInterval(loadMap, 10000);
loadMap();
</script>

</body>
</html>
