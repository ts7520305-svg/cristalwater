name: Field readiness integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['work/field-readiness-*']
permissions:
  contents: read
jobs:
  field:
    runs-on: ubuntu-latest
    # TASK500 reached the 90m job cap after 382/383 passing groups; setup took
    # about 14m before the 75m suite prefix. Reserve room for all 385 groups and
    # the restore gate; retain every per-script deadline and assertion.
    timeout-minutes: 105
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-test-only
          POSTGRES_DB: cristalwater_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cristalwater_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      QA_MODE: 'true'
      QA_ENVIRONMENT_SAFE: 'true'
      UPLOAD_DIR: uploads/qa/field-ci
      DATABASE_URL: postgresql://postgres:qa-test-only@127.0.0.1:5432/cristalwater_qa?connection_limit=10
      DIRECT_URL: postgresql://postgres:qa-test-only@127.0.0.1:5432/cristalwater_qa
      ENABLE_BACKGROUND_JOBS: 'false'
      EXTERNAL_NOTIFICATIONS_ENABLED: 'false'
      EMAIL_ENABLED: 'false'
      WHATSAPP_ENABLED: 'false'
      FISCAL_ISSUING_ENABLED: 'false'
      WEBHOOKS_ENABLED: 'false'
      ENABLE_ADMIN_AI_OPENAI: 'false'
      ENABLE_ADMIN_AI_WEB: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - name: Verify additive upgrade from the previous schema
        run: node scripts/test-field-migrations.js
      - run: npx playwright install --with-deps chromium
      - run: npm run check:syntax
      - run: npm test && npm run test:technician && npm run test:field-browser
      - run: node scripts/test-field-suite.js
      - name: Restore database and uploaded files in isolated QA
        env:
          CW_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-field-restore.js
      # Small machine-readable proofs remain downloadable independently of the
      # screenshots/PDF archive, which can exceed workspace transfer limits.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-readiness-gates
          path: |
            reports/field-suite/*/results.json
            reports/field-visual/operational-dashboard/snapshot.json
            reports/field-suite/dashboard-metrics.json
            reports/field-suite/summary-volume/results.json
            reports/field-suite/inventory-volume/results.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-readiness-results
          path: |
            reports/field-suite/
            reports/field-visual/
            reports/field-resilience/
            reports/equipment-flow/
          retention-days: 7
