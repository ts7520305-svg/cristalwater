<!doctype html>
<html lang="pt">
<head>

<title>Técnico - Mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:8px;
  z-index:999;
  width:240px;
}

button {
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#1e88e5;
  color:white;
  border:none;
}

.info {
  font-size:12px;
  margin-top:10px;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
<link rel="stylesheet" href="/cw-polish.css">
</head>

<body>

<div class="panel">
  <h3>Ronda do Dia</h3>

  <button onclick="loadToday()">Carregar Ronda</button>
  <button onclick="startTracking()">Iniciar GPS</button>
  <button onclick="nextPool()">Próxima Piscina</button>

  <button onclick="openGoogle()">Google Maps</button>
  <button onclick="openWaze()">Waze</button>

  <div class="info" id="infoBox"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/technician-map.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
