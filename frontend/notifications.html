<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Notificações - Cristal Water</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/foundation.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      margin: 0;
      color: #1f2937;
    }
    html, body { overflow-x: hidden; }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .top {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-gray {
      background: #6b7280;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 6px solid #2563eb;
    }

    .card.unread {
      border-left-color: #dc2626;
    }

    .title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      color: #666;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
</head>

<body data-required-role="ADMIN">

  <h1>Notificações</h1>

  <div class="top">
    <div id="count">A carregar...</div>
    <div>
      <button class="btn" onclick="markAllRead()">
        <span>✅</span><span>Marcar todas como lidas</span>
      </button>
      <button class="btn btn-gray" onclick="loadNotifications()">
        <span>🔄</span><span>Atualizar</span>
      </button>
    </div>
  </div>

  <div id="list" class="list"></div>

  <!-- 🔥 MUITO IMPORTANTE (WEBSOCKET) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- TEU SCRIPT -->
  <script src="/notifications.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
    <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
</body>
</html>
