<!doctype html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1723">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cristal Water - Historico Tecnico</title>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/cw-ui-kit.css">
  <script src="/cw-auth.js"></script>
  <script src="/technician-auth-guard.js"></script>
  <style>
    body { margin: 0; font-family: "Segoe UI", "Noto Sans", sans-serif; color: #102620; background: linear-gradient(180deg, #f7fbf9, #edf4f2); }
    .shell { width: min(960px, 100%); margin: 0 auto; padding: 12px 12px calc(120px + env(safe-area-inset-bottom)); }
    .card { background: #fff; border: 1px solid #c9d8d2; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 10px 28px rgba(16, 38, 32, 0.08); }
    .title { margin: 6px 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.05; font-weight: 900; }
    .muted { color: #577067; margin: 0; }
    .status { border-radius: 12px; border: 1px solid #c9d8d2; background: #f4faf7; padding: 10px; font-weight: 700; margin-bottom: 10px; }
    .status[data-tone="error"] { border-color: #efbbc5; background: #fdecef; color: #6f1223; }
    .status[data-tone="warning"] { border-color: #e4c289; background: #fff6e7; color: #5f3900; }
    .list { display: grid; gap: 8px; }
    .item { border: 1px solid #c9d8d2; border-radius: 12px; padding: 10px; background: #fff; }
    .item small { display: block; color: #577067; font-size: 12px; margin-top: 2px; }
    .empty { color: #577067; border: 1px dashed #c9d8d2; border-radius: 12px; padding: 14px; text-align: center; }
  </style>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="TECHNICIAN">
  <main class="shell">
    <section class="card">
      <p class="muted">Tecnico</p>
      <h1 class="title">Historico de Visitas</h1>
      <p class="muted">Consulta rapida das ultimas visitas concluidas, sem escrita.</p>
    </section>

    <p id="statusBox" class="status" aria-live="polite">A carregar historico.</p>

    <section class="card">
      <div id="historyList" class="list"></div>
    </section>
  </main>
  <script src="/technician-history.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
