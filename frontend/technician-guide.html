<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cristal Water - Guia Tecnico</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/cristal-assist.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#e8f7ff}
    header{padding:18px;background:#0b1b31;border-bottom:1px solid rgba(53,217,255,.25)}
    main{padding:14px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;margin:12px 0}
    .btn{border:0;border-radius:16px;padding:14px 16px;font-weight:900;background:#2563eb;color:white;width:100%;margin:7px 0;text-align:center;text-decoration:none;display:block}
    .warn{background:#f59e0b}.danger{background:#dc2626}
    input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#020617;color:#e8f7ff;margin:6px 0}
    .muted{color:#91a8be}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .movement{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);margin:8px 0}
    @media(max-width:700px){.row{grid-template-columns:1fr}}
  </style>
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/cw-polish.css">
  <link rel="stylesheet" href="css/crystal-v25.css">
</head>
<body>
  <header>
    <h1>Guia de Obra</h1>
    <div class="muted">Stock da viatura, consumos e documentos para apresentar quando necessario.</div>
  </header>
  <main>
    <section class="card">
      <h2>Iniciar dia</h2>
      <select id="vehicle"></select>
      <input id="techId" type="number" placeholder="ID tecnico">
      <input id="startKm" type="number" placeholder="Km inicial">
      <button class="btn" onclick="startDay()">Iniciar dia / abrir guia de obra</button>
      <div class="muted">Se a AT estiver indisponivel, o dia pode iniciar. Fica um alerta para a administracao associar a guia de transporte mais tarde.</div>
    </section>

    <section class="card">
      <h2>Stock atual</h2>
      <input id="vehicleStock" type="number" placeholder="ID viatura para ver stock">
      <button class="btn" onclick="loadStock()">Atualizar stock</button>
      <div id="stock"></div>
    </section>

    <section class="card">
      <h2>Registar consumo</h2>
      <input id="workGuideId" type="number" placeholder="ID guia obra">
      <input id="itemName" placeholder="Produto/material">
      <input id="qty" type="number" placeholder="Quantidade">
      <input id="visitId" type="number" placeholder="ID visita opcional">
      <input id="movementLocation" placeholder="Local/piscina se nao houver visita">
      <input id="movementNotes" placeholder="Notas do consumo">
      <button class="btn warn" onclick="consume()">Consumir material</button>
    </section>

    <section class="card">
      <h2>Fechar guia</h2>
      <input id="closeId" type="number" placeholder="ID guia obra">
      <input id="endKm" type="number" placeholder="Km final">
      <button class="btn danger" onclick="closeGuide()">Fechar dia</button>
    </section>
  </main>
  <script src="/technician-guide.js"></script>
  <script src="/cristal-help-data.js"></script>
  <script src="/cristal-assist.js"></script>
  <script src="/cw-flow-shell.js"></script>
</body>
</html>
