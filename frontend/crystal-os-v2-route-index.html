<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Índice de módulos · Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><link rel="stylesheet" href="/cw-admin-catalogue.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script></head>
<body data-required-role="ADMIN"><main id="adminCatalogue" data-catalogue-mode="index" data-cw-state-managed="manual" data-cw-form-memory="managed" data-cw-no-i18n>
<header class="panel"><h1 id="catalogueTitle">Índice de módulos</h1><p id="catalogueIntro"></p><nav class="toolbar"><a id="catalogueCenter" class="button" href="/admin-master-control" data-catalogue-copy="center">Centro</a><a id="catalogueSwitch" class="button" href="/admin-menu">Menu</a><label for="catalogueLanguage" data-catalogue-copy="language">Idioma</label><select id="catalogueLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></nav></header>
<section class="panel"><form id="catalogueFilters" autocomplete="off" novalidate><div class="filters"><label><span data-catalogue-copy="search">Pesquisar módulo</span><input id="catalogueSearch" type="search" maxlength="100" autocomplete="off"></label><label><span data-catalogue-copy="group">Área</span><select id="catalogueGroup"><option value="">Todas as áreas</option></select></label></div><button id="clearCatalogue" type="button" data-catalogue-copy="clear">Limpar filtros</button></form><p id="catalogueStatus" class="notice" role="status" aria-live="polite"></p><p id="catalogueCount" role="status" aria-live="polite"></p><p id="catalogueOffline" class="notice" data-catalogue-copy="offline" hidden></p><p class="muted" data-catalogue-copy="basis"></p><a id="catalogueLogin" class="button" href="/login" data-catalogue-copy="login" hidden>Entrar</a><button id="reloadCatalogue" type="button" data-catalogue-copy="reload" hidden>Recarregar</button></section>
<section id="shortcutPanel" class="panel" hidden><h2 data-catalogue-copy="shortcuts">Atalhos diários</h2><nav id="catalogueShortcuts" class="toolbar"></nav></section>
<section class="panel"><h2 data-catalogue-copy="modules">Módulos</h2><div id="catalogueRows" class="results" role="list"></div></section>
<noscript><p class="notice">Ative o JavaScript e entre com uma conta de administrador para consultar o menu.</p><a href="/login">Entrar</a></noscript>
</main><script src="/cw-admin-catalogue.js"></script><script src="/cw-admin-catalogue-copy.js"></script><script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script src="/admin-menu.js"></script><script defer src="/ui/design-system.js"></script></body></html>
