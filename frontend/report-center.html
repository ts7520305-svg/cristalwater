<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Cristal Water - Centro de Relatórios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 3px solid #1e88e5;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      color: #1e88e5;
    }

    main {
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 16px;
      max-width: 600px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
    }

    button {
      background: #1e88e5;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .report-center-main { padding-bottom: 120px; }
    .report-center-main .card { display: block !important; min-width: 0; background: #fff; color: #1f2937; }
    .report-center-main label, .report-center-main p { color: inherit; }
    .report-center-main input, .report-center-main select, .report-center-main button { min-width: 0; max-width: 100%; font-size: 16px; }
    .report-center-main button { min-height: 44px; background: #1565c0; white-space: normal; overflow-wrap: anywhere; }
    .report-center-main #status { overflow-wrap: anywhere; }
    .report-center-main button:disabled { opacity: .6; cursor: default; }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">

<header>
  <h1>Centro de Relatórios</h1>
</header>

<main class="report-center-main" data-cw-state-managed="manual">
  <div class="card">
    <label for="monthRef">Mês</label>
    <input type="month" id="monthRef">

    <label for="onlyRequiresInvoice">Filtro de faturação</label>
    <select id="onlyRequiresInvoice">
      <option value="false">Todos</option>
      <option value="true">Requer fatura</option>
    </select>

    <button id="openPrintableReport" type="button">Abrir relatório para imprimir / PDF</button>
    <p id="status" role="status" data-state="idle" aria-live="polite">Pronto.</p>
  </div>
</main>

<script src="/cw-report-download.js"></script>
<script src="/report-center.js"></script>
<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
