<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Cristal Water - Centro de Relatórios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 3px solid #1e88e5;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      color: #1e88e5;
    }

    main {
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 16px;
      max-width: 600px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
    }

    button {
      background: #1e88e5;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
</head>
<body data-required-role="ADMIN">

<header>
  <h1>Centro de Relatórios</h1>
</header>

<main>
  <div class="card">
    <label>Mês</label>
    <input type="month" id="monthRef">

    <label>Tipo</label>
    <select id="onlyRequiresInvoice">
      <option value="false">Todos os clientes</option>
      <option value="true">Só clientes que requerem fatura</option>
    </select>

    <button onclick="openPrintableReport()">Abrir relatório para imprimir / PDF</button>
    <p id="status" aria-live="polite">Pronto.</p>
  </div>
</main>

<script>
  function authHeaders(extra = {}) {
    const token = localStorage.getItem("token") || localStorage.getItem("cristalwater_jwt");
    return {
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...extra,
    };
  }

  function setStatus(message) {
    const node = document.getElementById("status");
    if (node) node.textContent = message;
  }

  function getCurrentMonthRef() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    return `${y}-${m}`;
  }

  document.getElementById("monthRef").value = getCurrentMonthRef();

  async function openPrintableReport() {
    const monthRef = document.getElementById("monthRef").value;
    const onlyRequiresInvoice = document.getElementById("onlyRequiresInvoice").value;

    const url =
      `/api/reports/monthly-print?monthRef=${encodeURIComponent(monthRef)}&onlyRequiresInvoice=${encodeURIComponent(onlyRequiresInvoice)}`;

    try {
      setStatus("A preparar relatório...");
      const res = await fetch(url, { headers: authHeaders() });
      if (!res.ok) throw new Error("Erro ao preparar relatório");
      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      window.open(objectUrl, "_blank");
      setStatus("Relatório aberto.");
      setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
    } catch (_) {
      setStatus("Erro ao abrir relatório.");
    }
  }
</script>
<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
</body>
</html>
