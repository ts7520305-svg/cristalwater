<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cristal Water LDA - Tecnicos</title>
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
<style>
    :root{--bg:#06111f;--panel:#0d1d31;--line:#24415f;--txt:#e9f5ff;--muted:#8fb1cc;--brand:#35d1ff;--ok:#40e6a0;--warn:#ffd166;--bad:#ff6b6b;--input:#091829}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(120deg,#06111f,#0b1f33 55%,#06111f);color:var(--txt);font-family:Inter,Segoe UI,Arial,sans-serif}
    main.page{padding:24px;max-width:1500px;margin:0 auto}
    .page-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}
    .page-head h1{margin:0;font-size:30px}
    .page-head p{margin:6px 0 0;color:var(--muted)}
    .grid{display:grid;gap:16px}
    .card{background:rgba(13,29,49,.92);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
    .label,.muted{color:var(--muted);font-size:13px}
    input,select,textarea{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0}
    button,.btn{border:0;border-radius:14px;padding:12px 16px;background:#163354;color:var(--txt);font-weight:800;cursor:pointer;margin:4px 0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button.primary,.btn.primary{background:linear-gradient(135deg,#0584c7,#35d1ff);color:#03121c}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:#bfe4ff;background:#0a1b2e;font-size:12px}
    .technician-layout{grid-template-columns:1fr}
    .technician-form{max-width:920px}
    .technician-form form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
    .technician-form form>input:first-child,.technician-form form>input:nth-child(2),.technician-form form>button{grid-column:1/-1}
    .list{display:grid;gap:10px;overflow-x:auto;padding-bottom:4px}
    .technician-toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin:8px 0 14px}
    .technician-toolbar input{margin:0}
    .technician-count{color:#8fb1cc;font-size:13px;white-space:nowrap}
    .tech-list-head,.tech-row{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(240px,1.2fr) minmax(170px,.8fr) minmax(380px,auto);gap:12px;align-items:center}
    .tech-list-head{padding:0 14px 8px;color:#7dd3fc;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
    .tech-row{min-width:980px;background:#0a1b2e;border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--txt)}
    .tech-name{display:flex;align-items:center;gap:8px;min-width:0}
    .tech-name b,.tech-meta span{overflow-wrap:anywhere}
    .tech-meta{display:grid;gap:4px;min-width:0}
    .tech-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .tech-actions button{min-width:80px;padding:10px 11px;text-align:center}
    .cw-empty{border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted)}
    @media(max-width:1100px){
      main.page{padding:14px}
      .page-head{flex-direction:column}
      .row,.technician-form form,.technician-toolbar{grid-template-columns:1fr}
      .tech-list-head{display:none}
      .list{overflow-x:visible}
      .tech-row{min-width:0;grid-template-columns:1fr}
      .tech-actions{justify-content:flex-start}
    }
  </style>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
</head>
<body data-required-role="ADMIN">

  <div style="padding:12px 16px 0">
    <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
  </div>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Tecnicos</h1>
        <p>Criar tecnicos, PIN, contacto, zona e estado operacional.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/admin-master-control">Centro de Operacoes</a>
      </div>
    </div>

    <section class="grid technician-layout">
      <div class="card technician-form">
        <h2>Novo tecnico</h2>
        <form id="technicianForm" onsubmit="createTechnician();return false">
          <input id="name" name="name" placeholder="Nome do tecnico" required>
          <input id="email" name="email" placeholder="Email">
          <div class="row">
            <input id="phone" name="phone" placeholder="Telefone">
            <input id="pin" name="pin" placeholder="PIN de login">
          </div>
          <div class="row">
            <input id="zone" name="zone" placeholder="Zona">
            <input id="vehicleId" name="vehicleId" placeholder="ID viatura opcional">
          </div>
          <button class="primary">Criar tecnico</button>
        </form>
      </div>

      <div class="card technician-list-card">
        <h2>Lista de tecnicos</h2>
        <div class="technician-toolbar">
          <input id="technicianSearch" placeholder="Pesquisar por nome, telefone, email, PIN, zona ou viatura">
          <span class="technician-count" id="technicianCount">0 tecnico(s)</span>
          <button id="toggleInactive" type="button" onclick="toggleInactive()">Ver inativos</button>
        </div>
        <div id="list" class="list muted">A carregar...</div>
      </div>
    </section>
  </main>
  <script src="/admin-auth-guard.js"></script>
  <script src="/cw-operational-risk.js?v=22.6.13-risk-jump" data-cw-operational-risk="1"></script>
  <script src="/admin-technicians.js?v=22.6.13-risk-jump"></script>
  <script src="/cristal-help-data.js"></script>
  <script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
</body>
</html>
