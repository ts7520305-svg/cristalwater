<!doctype html><html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cristal Water — Gestão de técnicos</title>
<script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><link rel="stylesheet" href="/cristal-assist.css"><link rel="stylesheet" href="/cw-technician-management.css">
</head><body data-required-role="ADMIN"><main id="technicianManager" data-cw-state-managed="manual" data-cw-form-memory="managed" data-cw-no-i18n>
<header class="hub-heading"><div><p class="eyebrow">CRISTAL WATER</p><h1 data-tech-copy="title"></h1><p data-tech-copy="intro"></p></div><label><span data-tech-copy="language"></span><select id="technicianLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label></header>
<nav class="hub-actions"><a data-destination="/admin-master-control" href="/admin-master-control" data-tech-copy="centre"></a><button id="newTechnician" data-tech-copy="CREATE"></button><a data-destination="/admin-vehicles" href="/admin-vehicles" data-tech-copy="vehicleAlerts"></a><a data-destination="/operational-dashboard" href="/operational-dashboard" data-tech-copy="operationAlerts"></a><a data-destination="/admin-security" href="/admin-security" data-tech-copy="security"></a></nav>
<section id="technicianWritePanel" class="hub-panel" hidden><h2 data-tech-copy="creation"></h2><p class="muted" data-tech-copy="memory"></p><p id="writeStatus" role="status" aria-live="polite"></p><p id="writeReference" class="reference"></p>
<div class="hub-actions"><button id="checkWrite" data-tech-copy="check" hidden></button><button id="retryWrite" data-tech-copy="retry" hidden></button><button id="cancelWrite" data-tech-copy="cancel" hidden></button><button id="discardPreparation" data-tech-copy="discard" hidden></button><button id="nextWrite" data-tech-copy="next" hidden></button></div><p id="cancelHint" data-tech-copy="cancelHint" hidden></p>
<form id="technicianForm" autocomplete="off" hidden><h3 id="operationTitle"></h3><p id="targetIdentity"></p><div id="technicianFields" class="hub-fields"></div><p id="pinHint" class="muted" data-tech-copy="pinHint"></p><button type="submit" class="primary" data-tech-copy="prepare"></button></form>
<section id="technicianReview" hidden><h3 data-tech-copy="reviewTitle"></h3><p id="reviewTarget"></p><div class="review-columns"><div><h4 data-tech-copy="before"></h4><dl id="reviewBefore"></dl></div><div><h4 data-tech-copy="after"></h4><dl id="reviewAfter"></dl></div></div><p id="reviewUser"></p><p id="reviewExpiry"></p><p id="reviewRevokes" class="review-emphasis" data-tech-copy="revokes" hidden></p><p data-tech-copy="preserves"></p><label class="check"><input id="confirmTechnician" type="checkbox"><span data-tech-copy="confirm"></span></label><div class="hub-actions"><button id="saveTechnician" class="primary" data-tech-copy="save"></button><button id="backToFields" data-tech-copy="backEdit"></button></div></section>
</section>
<section class="hub-panel"><div class="hub-actions"><h2 id="directoryHeading" data-tech-copy="directory"></h2><button id="refreshTechnicians" data-tech-copy="refresh"></button></div><form id="technicianFilters" class="hub-filters"><label><span data-tech-copy="search"></span><input id="technicianSearch" type="search" maxlength="200"></label><label><span data-tech-copy="activity"></span><select id="technicianActive"><option value="true" data-tech-copy="active"></option><option value="all" data-tech-copy="all"></option><option value="false" data-tech-copy="inactive"></option></select></label><button type="submit" data-tech-copy="apply"></button><button id="clearTechnicianSearch" type="button" data-tech-copy="clear"></button></form><p id="technicianStatus" role="status" aria-live="polite"></p><p id="technicianCount"></p><div id="technicianList" class="hub-grid"></div><nav class="hub-actions"><button id="technicianPrevious" data-tech-copy="previous"></button><span id="technicianPage"></span><button id="technicianNext" data-tech-copy="following"></button></nav></section>
</main><script src="/cw-technician-management-rules.js"></script><script src="/cw-technician-management-copy.js"></script><script src="/admin-technicians.js"></script><script src="/cristal-help-data.js"></script><script src="/cristal-assist.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script></body></html>
