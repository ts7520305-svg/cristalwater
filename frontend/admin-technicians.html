<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cristal Water LDA - Tecnicos</title>
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
<style>
    *{box-sizing:border-box}
  body{margin:0}
  main.page{padding:24px;display:grid;gap:16px}
    .page-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}
    .page-head h1{margin:0;font-size:30px}
  .page-head p{margin:6px 0 0;color:var(--ds-text-muted)}
    .grid{display:grid;gap:16px}
  .card{padding:18px}
  .label,.muted{color:var(--ds-text-muted);font-size:13px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .technician-layout{grid-template-columns:1fr}
    .technician-form{max-width:920px}
    .technician-form form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
    .technician-form form>input:first-child,.technician-form form>input:nth-child(2),.technician-form form>button{grid-column:1/-1}
    .list{display:grid;gap:10px;overflow-x:auto;padding-bottom:4px}
    .technician-toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin:8px 0 14px}
    .technician-toolbar input{margin:0}
  .technician-count{color:var(--ds-text-muted);font-size:13px;white-space:nowrap}
    .tech-list-head,.tech-row{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(240px,1.2fr) minmax(170px,.8fr) minmax(380px,auto);gap:12px;align-items:center}
  .tech-list-head{padding:0 14px 8px;color:var(--ds-text-muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
  .tech-row{min-width:980px;padding:14px}
    .tech-name{display:flex;align-items:center;gap:8px;min-width:0}
    .tech-name b,.tech-meta span{overflow-wrap:anywhere}
    .tech-meta{display:grid;gap:4px;min-width:0}
    .tech-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .tech-actions button,.tech-actions .cw-v2-btn{min-width:80px;padding:10px 11px;text-align:center;min-height:46px}
    .cw-risk-inline-list,.cw-risk-badges{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .cw-risk-badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--ds-border);background:var(--ds-surface-soft);color:var(--ds-text);font-size:12px;font-weight:800;text-decoration:none}
    .cw-risk-badge[data-severity="CRITICAL"]{border-color:color-mix(in srgb, var(--ds-danger) 45%, white);background:#fff1f1;color:#7f2021}
    .cw-risk-badge[data-severity="WARNING"]{border-color:color-mix(in srgb, var(--ds-warning) 45%, white);background:#fff7e8;color:#805200}
    .cw-risk-global-actions a,.cw-risk-global-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
    .cw-risk-global-item{display:grid;align-items:center;min-height:44px}
  .cw-empty{border:1px dashed var(--ds-border);border-radius:16px;padding:16px;color:var(--ds-text-muted);background:var(--ds-surface-soft)}
  .field-stack{display:grid;gap:8px}
  .field-stack label{font-size:12px;font-weight:800;color:var(--ds-text-muted)}
  .technician-back{padding:12px 16px 0}
  .tech-head-actions{text-align:right}
    @media(max-width:1100px){
      main.page{padding:14px}
      .page-head{flex-direction:column}
      .row,.technician-form form,.technician-toolbar{grid-template-columns:1fr}
      .tech-list-head{display:none}
      .list{overflow-x:visible}
      .tech-row{min-width:0;grid-template-columns:1fr}
      .tech-actions{justify-content:flex-start}
    }
  </style>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">

  <div class="technician-back">
    <button class="cw-v2-btn" type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
  </div>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Tecnicos</h1>
        <p>Criar tecnicos, PIN, contacto, zona e estado operacional.</p>
      </div>
      <div class="actions">
        <a class="cw-v2-btn" href="/admin-master-control">Centro de Operacoes</a>
      </div>
    </div>

    <section class="grid technician-layout">
      <div class="card technician-form">
        <h2>Novo tecnico</h2>
        <form id="technicianForm" onsubmit="createTechnician();return false">
          <div class="field-stack"><label for="name">Nome do tecnico</label><input id="name" name="name" placeholder="Nome do tecnico" required></div>
          <div class="field-stack"><label for="email">Email</label><input id="email" name="email" placeholder="Email"></div>
          <div class="row">
            <div class="field-stack"><label for="phone">Telefone</label><input id="phone" name="phone" placeholder="Telefone"></div>
            <div class="field-stack"><label for="pin">PIN de login</label><input id="pin" name="pin" placeholder="PIN de login"></div>
          </div>
          <div class="row">
            <div class="field-stack"><label for="zone">Zona</label><input id="zone" name="zone" placeholder="Zona"></div>
            <div class="field-stack"><label for="vehicleId">ID viatura opcional</label><input id="vehicleId" name="vehicleId" placeholder="ID viatura opcional"></div>
          </div>
          <button class="cw-v2-btn primary">Criar tecnico</button>
        </form>
      </div>

      <div class="card technician-list-card">
        <h2>Lista de tecnicos</h2>
        <div class="technician-toolbar">
          <div class="field-stack"><label for="technicianSearch">Pesquisa</label><input id="technicianSearch" placeholder="Pesquisar por nome, telefone, email, PIN, zona ou viatura"></div>
          <span class="technician-count" id="technicianCount">0 tecnico(s)</span>
          <button class="cw-v2-btn" id="toggleInactive" type="button" onclick="toggleInactive()">Ver inativos</button>
        </div>
        <div id="list" class="list muted">A carregar...</div>
      </div>
    </section>
  </main>
  <script src="/admin-auth-guard.js"></script>
  <script src="/cw-ui-feedback.js"></script>
  <script src="/cw-operational-risk.js?v=22.6.13-risk-jump" data-cw-operational-risk="1"></script>
  <script src="/admin-technicians.js?v=22.6.13-risk-jump"></script>
  <script src="/cristal-help-data.js"></script>
  <script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
