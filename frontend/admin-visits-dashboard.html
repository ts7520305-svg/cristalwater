<!doctype html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1723">
  <meta charset="utf-8">
  <title data-cw-visits-copy="title" data-cw-no-i18n>Painel Admin - Visitas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script defer src="/cw-i18n.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/ui/design-system.css">
  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      color: var(--cw-text, #1f2937);
      background: #eef3f8;
    }

    .page {
      --cw-text: #1f2937;
      --cw-muted: #4b6075;
      --cw-border: #c8d7e7;
      color: var(--cw-text);
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--cw-muted, #5f7388);
    }

    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .cw-btn {
      min-height: 44px;
      border: 1px solid var(--cw-border, #c8d7e7);
      border-radius: 12px;
      padding: 10px 14px;
      background: #fff;
      color: var(--cw-text, #1f2937);
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cw-btn.primary {
      background: #1267c4;
      color: #fff;
      border-color: #1f78e0;
    }

    .cw-btn.danger {
      background: #c62828;
      color: #fff;
      border-color: #c62828;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(280px, 2fr) minmax(220px, 1fr);
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--cw-border, #c8d7e7);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(24, 45, 72, 0.08);
      margin-bottom: 14px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--cw-border, #c8d7e7);
      border-radius: 10px;
      background: #f9fbfd;
      color: var(--cw-text, #1f2937);
    }

    #visits {
      display: grid;
      gap: 12px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--cw-border, #c8d7e7);
      border-left-width: 6px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 26px rgba(24, 45, 72, 0.08);
    }

    .card.done { border-left-color: #1b8d4e; }
    .card.progress { border-left-color: #e07b18; }

    .card h3 {
      margin: 0 0 10px;
      color: #113c72;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .box {
      border: 1px solid #d7e3ef;
      border-radius: 12px;
      background: #f6faff;
      padding: 10px;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0;
      color: #5f7388;
      margin-bottom: 4px;
    }

    .value { font-weight: 800; }
    .done-text { color: #176f3e; }
    .pending-text { color: #945012; }
    .page h1, .card h3, .value, .card p { overflow-wrap: anywhere; }
    .page-actions .cw-lang-switch select { min-height: 44px; }

    .photos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .photos img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #d7e3ef;
      background: #eef4fb;
    }

    @media (max-width: 900px) {
      .page { padding: 12px; }
      .page-head { flex-direction: column; }
      .toolbar { grid-template-columns: 1fr; }
      .page-actions { width: 100%; }
      .page-actions .cw-btn { flex: 1; }
    }

    .cw-help-fab,
    .cw-help-fab.cw-help-fab-quiet {
      display: none;
    }
  </style>
</head>
<body data-required-role="ADMIN">
  <main class="page" data-cw-no-i18n data-cw-state-managed="manual">
    <section class="page-head">
      <div>
        <h1 data-cw-visits-copy="title">Painel Admin - Visitas</h1>
        <p data-cw-visits-copy="intro">Monitorizacao operacional de visitas com estado, parametros e evidencias fotograficas.</p>
      </div>
      <div class="page-actions cw-global-actions">
        <button class="cw-btn" type="button" data-cw-back data-cw-fallback="/admin-master-control" data-cw-visits-copy="back">Voltar</button>
        <button class="cw-btn primary" id="refreshBtn" type="button" data-cw-visits-copy="refresh">Atualizar</button>
        <button class="cw-btn danger" id="logoutBtn" type="button" data-cw-logout data-cw-visits-copy="logout">Sair</button>
      </div>
    </section>

    <section class="toolbar" aria-label="Filtros de visitas" data-cw-visits-aria="filters">
      <input id="searchInput" placeholder="Pesquisar cliente, piscina, tecnico ou nota" data-cw-visits-placeholder="search" aria-label="Pesquisar cliente, piscina, tecnico ou nota" data-cw-visits-aria="search">
      <select id="statusFilter" aria-label="Filtrar por estado" data-cw-visits-aria="statusFilter">
        <option value="" data-cw-visits-copy="all">Todos os estados</option>
        <option value="DONE" data-cw-visits-copy="done">Concluída</option>
        <option value="IN_PROGRESS" data-cw-visits-copy="progress">Em curso</option>
      </select>
    </section>

    <section id="visits" aria-live="polite"></section>
  </main>

<script src="/admin-auth-guard.js"></script>

<script src="/admin-visits-dashboard.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
<script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
