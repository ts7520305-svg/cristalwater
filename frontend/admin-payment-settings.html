<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Lembretes de pagamento · Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script>
<style>
#paymentPolicy{max-width:1100px;margin:auto;padding:20px;min-width:0;color:#183c46}#paymentPolicy *{box-sizing:border-box}#paymentPolicy h1{margin:0;font-size:clamp(24px,4vw,34px)}#paymentPolicy h2{font-size:23px;margin-top:0}#paymentPolicy h3{font-size:19px;margin:0 0 10px}
#paymentPolicy .panel,#paymentPolicy .legacy-card{background:#fff;color:#183c46;border:1px solid #bed2d8;border-radius:12px;padding:18px;margin:14px 0;min-width:0;overflow-wrap:anywhere}#paymentPolicy > header{backdrop-filter:none}
#paymentPolicy .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#paymentPolicy select{min-width:0;color:#183c46;background:#fff;border:1px solid #91adb7;padding:10px;border-radius:8px}
#paymentPolicy button,#paymentPolicy .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid #13716f;border-radius:8px;background:#096665;color:#fff;text-decoration:none;white-space:normal;max-width:100%;font:inherit;cursor:pointer}#paymentPolicy button:disabled{opacity:.5;cursor:default}#paymentPolicy :focus-visible{outline:3px solid #087d79;outline-offset:3px}
#paymentPolicy .muted,#paymentPolicy dt{color:#45636d}#paymentPolicy .note{padding:12px;background:#edf6f7;border-radius:8px}#policyStatus{padding:12px;background:#edf6f7;border-radius:8px}#policyStatus[data-state=error],#policyStatus[data-state=session]{background:#fff0ed;color:#842f20}#portalState{font-size:21px;font-weight:700}#paymentPolicy dl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:14px}#paymentPolicy dd{margin:4px 0 0;font-weight:600}#paymentPolicy code{white-space:pre-wrap;overflow-wrap:anywhere;color:#183c46}
@media(max-width:650px){#paymentPolicy{padding:12px}#paymentPolicy dl{grid-template-columns:1fr}#paymentPolicy .panel,#paymentPolicy .legacy-card{padding:14px}}
</style></head><body data-required-role="ADMIN">
<main id="paymentPolicy" data-cw-state-managed="manual">
<header class="panel"><h1 data-policy-copy="title">Lembretes de pagamento</h1><p class="muted" data-policy-copy="subtitle"></p><nav class="toolbar"><a class="button" href="/admin-master-control" data-policy-copy="center">Centro</a><a class="button" href="/billing-center" data-policy-copy="collections">Cobranças</a><label for="policyLanguage" data-policy-copy="language">Idioma</label><select id="policyLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></nav></header>
<section class="panel"><div class="toolbar"><button id="refreshPolicy" type="button" data-policy-copy="refresh">Atualizar</button></div><p id="policyStatus" role="status" aria-live="polite">A confirmar a configuração…</p><p id="policyChecked" class="muted"></p></section>
<div id="policyContent" hidden>
<section class="panel"><h2 data-policy-copy="portal"></h2><p id="portalState"></p><p data-policy-copy="scope"></p><p class="note" data-policy-copy="execution"></p><dl id="portalFacts"></dl><p id="portalInvalid" hidden data-policy-copy="interpretedOff"></p><a id="operationalSettings" class="button" href="/admin-operational-settings#paymentReminderSettings" data-policy-copy="settings"></a></section>
<section class="panel"><h2 data-policy-copy="manualTitle"></h2><p data-policy-copy="manualNote"></p><a class="button" href="/invoices" data-policy-copy="invoices"></a></section>
<section class="panel"><h2 data-policy-copy="legacyTitle"></h2><p class="note" data-policy-copy="legacyNote"></p><div id="legacyPolicyRows" role="list"></div></section>
</div></main>
<script src="/cw-payment-policy-rules.js"></script><script src="/cw-payment-policy-copy.js"></script><script src="/admin-payment-settings.js"></script>
<script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script>
</body></html>
