<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cristal Water · Histórico técnico</title><link rel="stylesheet" href="/ui/foundation.css">  <style>
    html, body { overflow-x: hidden; }
    .finance-shell {
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .finance-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .finance-head h1 { margin: 0; }
    .finance-nav,
    .finance-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .finance-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 210px auto;
      align-items: center;
    }
    .finance-filters {
      display: grid;
      gap: 8px;
    }
    .finance-filters label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ds-text-muted);
    }
    #technicalHistory{max-width:1440px;margin:auto;min-width:0;color:#183c46}
    #technicalHistory .card{min-width:0;background:#fff;color:#183c46}
    #technicalHistory .finance-toolbar{grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}
    #technicalHistory input,#technicalHistory select{width:100%;min-width:0;color:#183c46;background:#fff;border:1px solid #91adb7}
    #technicalHistory .finance-filters label,#technicalHistory .text-muted{color:#45636d}
    #technicalHistory :focus-visible{outline:3px solid #087d79;outline-offset:3px}
    #technicalHistory button:disabled{opacity:.5;cursor:default}
    #technicalHistory .history-pagination{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
    #technicalHistory #historyStatus{padding:12px;background:#edf6f7;color:#194c59;border-radius:8px;scroll-margin-top:125px}
    #technicalHistory #historyStatus[data-state=error],#technicalHistory #historyStatus[data-state=invalid],#technicalHistory #historyStatus[data-state=session]{background:#fff0ed;color:#842f20}
    #technicalHistory #historyRows{display:grid;gap:12px;min-width:0}
    #technicalHistory .history-card{border:1px solid #bed2d8;border-radius:12px;padding:16px;min-width:0;overflow-wrap:anywhere}
    #technicalHistory .history-card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    #technicalHistory .history-card h2{font-size:18px;margin:0}#technicalHistory .history-amount{font-size:21px}
    #technicalHistory .history-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
    #technicalHistory dt{color:#45636d;font-size:13px}#technicalHistory dd{margin:3px 0 0;font-weight:600}
    #technicalHistory details{margin:10px 0}#technicalHistory summary{cursor:pointer;font-weight:700}
    #technicalHistory .history-notes{white-space:pre-wrap}#technicalHistory .history-review{padding:10px;background:#fff6df;color:#644313;border-radius:8px}
    #technicalHistory .history-credit{font-weight:700;color:#075a67}#technicalHistory .history-card .cw-v2-btn{margin-top:8px;white-space:normal;max-width:100%}
    @media(max-width:600px){#technicalHistory{padding:10px}#technicalHistory .finance-toolbar,#technicalHistory .history-facts{grid-template-columns:1fr}#technicalHistory .card{padding:14px}}
    @media (max-width: 920px) {
      .finance-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style><script src="/cw-auth.js"></script><script src="/client-auth-guard.js"></script><link rel="stylesheet" href="/crystal-os-v2-foundation.css"><link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css"><link rel="stylesheet" href="/ui/design-system.css"></head>
<body data-cw-role="CLIENT" data-required-role="CLIENT" data-history-view="history">
<main><section class="finance-shell page" id="technicalHistory" data-cw-no-i18n data-cw-form-memory="managed" data-cw-state-managed="manual">
<header class="card finance-head"><div><h1 data-history-copy="title">Histórico técnico</h1><p data-history-copy="subtitle"></p></div><div class="finance-nav"><a class="cw-v2-btn" id="portalLink" href="/client-portal" data-history-copy="portal">Portal</a><a class="cw-v2-btn" id="documentsLink" href="/client-portal#documentsPanel" data-history-copy="documents">Relatórios e documentos</a><label for="historyLanguage" data-history-copy="language">Idioma</label><select id="historyLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></div></header>
<section class="card"><form id="historyFilters" class="finance-toolbar" autocomplete="off" novalidate><div class="finance-filters"><label for="historyPoolId" data-history-copy="poolId">Número da piscina</label><input id="historyPoolId" inputmode="numeric"></div><div class="finance-filters"><label for="historyFrom" data-history-copy="from">Desde</label><input id="historyFrom" placeholder="YYYY-MM-DD" inputmode="numeric"></div><div class="finance-filters"><label for="historyTo" data-history-copy="to">Até</label><input id="historyTo" placeholder="YYYY-MM-DD" inputmode="numeric"></div><button class="cw-v2-btn primary" id="refreshHistory" type="submit" data-history-copy="refresh">Atualizar</button></form>
<p data-history-copy="basis" class="text-muted"></p><p data-history-copy="names" class="text-muted"></p><p data-history-copy="dateNote" class="text-muted"></p><div id="historyStatus" role="status" aria-live="polite">A consultar o histórico…</div><p id="historyChecked" class="text-muted"></p>
<nav class="history-pagination"><button id="historyFirst" type="button" data-history-copy="first">Primeira página</button><button id="historyPrevious" type="button" data-history-copy="previous">Anterior</button><button id="historyNext" type="button" data-history-copy="next">Seguinte</button></nav><div id="historyRows" role="list"></div><nav class="history-pagination"><button id="historyFirstBottom" type="button" data-history-copy="first">Primeira página</button><button id="historyPreviousBottom" type="button" data-history-copy="previous">Anterior</button><button id="historyNextBottom" type="button" data-history-copy="next">Seguinte</button></nav></section></section></main>
<script src="/cw-client-technical-rules.js"></script><script src="/cw-client-technical-copy.js"></script><script src="/client-history.js"></script><script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script></body></html>
