<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cristal Water - Mensagens do Cliente</title>

<link rel="stylesheet" href="/ui/foundation.css">

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 10px;
}

.header {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.messages {
  background: white;
  padding: 10px;
  border-radius: 10px;
  height: 60vh;
  overflow-y: auto;
}

.msg {
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  max-width: 70%;
}

.me {
  background: #2563eb;
  color: white;
  margin-left: auto;
}

.other {
  background: #e5e7eb;
}

.input {
  display: flex;
  margin-top: 10px;
}

textarea {
  flex: 1;
  padding: 10px;
}

button {
  width: 120px;
  background: #2563eb;
  color: white;
  border: none;
}
html body .msg.me small,html body .msg.me a{color:#fff!important}html body .msg.other small{color:#334155!important}h1{font-size:24px}*{box-sizing:border-box}.msg{overflow-wrap:anywhere;white-space:pre-wrap}textarea{min-width:0;font-size:16px}button{min-height:44px;border-radius:8px}.cw-client-chat-recovery{max-width:100%}@media(max-width:420px){.msg{max-width:94%}.input{display:grid;gap:8px}.input button{width:100%}}
</style>

<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <script src="/client-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
<style>
html body.cw-v2-shell-enabled{padding-top:84px;padding-bottom:100px;}
html body.cw-v2-shell-enabled > .cw-v2-shell-topbar{position:fixed!important;top:0;left:0;right:0;}
html body.cw-v2-shell-enabled > .cw-v2-mobile-primary{position:fixed!important;}
html body.cw-v2-shell-enabled > .cw-v2-shell-sidebar{display:none!important;}
html body.cw-v2-shell-enabled .ds-bottom-nav{display:none!important;}
html body .header,html body .messages,html body .input,html body .cw-client-chat-recovery{max-width:1000px;margin-left:auto;margin-right:auto;}
@media(max-width:900px){html body.cw-v2-shell-enabled{padding-top:128px;}html body.cw-v2-shell-enabled .cw-v2-shell-topbar .cw-v2-topbar{min-height:128px;}}
</style>
</head>

<body data-cw-role="CLIENT" data-required-role="CLIENT">

  <div style="padding:12px 16px 0">
    <button type="button" data-cw-back data-cw-fallback="/client-menu">Voltar</button>
  </div>

<div class="header">
  <h1>Conversa com a administração</h1>
  <input id="clientId" type="hidden">
  <button type="button" onclick="load()">Atualizar</button>
</div>

<div id="messages" class="messages"></div>

<div class="input">
  <textarea id="text" aria-label="Mensagem" maxlength="10000"></textarea>
  <button id="sendBtn" type="button" onclick="send()">Enviar</button>
</div>

<script src="/cw-auth-download.js"></script>
<script src="/cw-client-chat-send.js"></script>
<script src="/client_chat.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
