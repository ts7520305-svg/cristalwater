<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mapa Multi Técnicos</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
<link rel="stylesheet" href="/cw-polish.css">
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const API = "/api";

const map = L.map('map').setView([37.1, -8.6], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

const colors = ["red","blue","green","purple","orange"];

async function load(){

  const res = await fetch(`${API}/routes/multi-profit-route`);
  const data = await res.json();

  data.plans.forEach((plan, index)=>{

    const color = colors[index % colors.length];

    const coords = [];

    plan.route.forEach(p=>{

      L.circleMarker([p.latitude,p.longitude],{
        color,
        radius:8
      })
      .addTo(map)
      .bindPopup(`
        <b>${plan.technician}</b><br>
        ${p.name}<br>
        Lucro: €${p.profit}
      `);

      coords.push([p.latitude,p.longitude]);
    });

    L.polyline(coords,{ color }).addTo(map);
  });
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script src="/cw-flow-shell.js"></script>
</body>
</html>
