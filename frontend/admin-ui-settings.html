<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preferências de navegação · Cristal Water</title><link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><link rel="stylesheet" href="/cw-navigation-preferences.css"><link rel="stylesheet" href="/cw-appearance.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script></head>
<body id="appearancePage" data-required-role="ADMIN"><main id="appearance" data-cw-state-managed="manual" data-cw-form-memory="managed" data-cw-no-i18n>

<section class="panel"><p id="appearanceStatus" class="notice" role="status" aria-live="polite"></p><p data-appearance-copy="scope"></p><a id="appearanceLogin" class="button" href="/login" data-appearance-copy="login" hidden>Voltar a entrar</a></section>
