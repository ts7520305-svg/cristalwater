<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mapa Inteligente</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet" href="/ui/foundation.css">

<style>
body { margin:0; font-family:Arial; }
#map { width:100%; height:100vh; }

.top{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:white;
  padding:10px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

button{
  padding:8px;
  border:none;
  border-radius:6px;
  background:#1e88e5;
  color:white;
  cursor:pointer;
}

.clear{ background:#ef4444; }
.zone{ background:#2e7d32; }
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body data-required-role="ADMIN">

<div style="padding:12px 16px 0">
  <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
</div>

<div class="top">
  <div id="statusLine" style="font-size:12px;color:#334155;max-width:220px;">A carregar mapa...</div>
  <button onclick="showZones()">Ver Zonas</button>
  <button onclick="assignZones()">Atribuir Técnicos</button>
  <button class="clear" onclick="clearMap()">Limpar</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/admin-auth-guard.js"></script>
<script src="/ui/core/navigation-context.js"></script>

<script>
const API = "/api";

function token(){
  return localStorage.getItem("token") || localStorage.getItem("authToken") || localStorage.getItem("cwAdminToken") || "";
}

function authHeaders(){
  const t = token();
  return t ? { Authorization: `Bearer ${t}` } : {};
}

async function fetchJson(path){
  const res = await fetch(`${API}${path}`, { headers: { ...authHeaders() } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) {
    throw new Error(data.error || data.message || `Erro ${res.status}`);
  }
  return data;
}

function setStatus(message){
  const line = document.getElementById("statusLine");
  if (line) line.textContent = message;
}

const map = L.map('map').setView([37.1, -8.6], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

let pools = [];
let markers = [];
let zoneLayers = [];

// ==========================================================
// LOAD POOLS
// ==========================================================

async function load(){
  try {
    setStatus("A carregar piscinas...");
    const data = await fetchJson("/pools");
    pools = Array.isArray(data) ? data : (data.pools || []);
    drawPools();
    setStatus(`Piscinas carregadas: ${pools.length}`);
  } catch (e) {
    setStatus(e.message || "Erro ao carregar mapa");
  }
}

// ==========================================================
// DRAW POOLS
// ==========================================================

function drawPools(){

  markers.forEach((m) => map.removeLayer(m));
  markers = [];

  if (!Array.isArray(pools) || !pools.length) {
    return;
  }

  pools.forEach(p=>{

    if (!p.latitude || !p.longitude) return;

    const m = L.marker([p.latitude,p.longitude])
      .addTo(map)
      .bindPopup(p.name);

    markers.push(m);
  });
}

// ==========================================================
// CALCULAR ZONAS
// ==========================================================

function getBounds(){

  const points = pools.filter((p) => Number.isFinite(Number(p.latitude)) && Number.isFinite(Number(p.longitude)));
  if (!points.length) return null;

  const lats = points.map(p=>Number(p.latitude));
  const lngs = points.map(p=>Number(p.longitude));

  return {
    minLat: Math.min(...lats),
    maxLat: Math.max(...lats),
    minLng: Math.min(...lngs),
    maxLng: Math.max(...lngs)
  };
}

// ==========================================================
// DESENHAR ZONAS
// ==========================================================

function showZones(){

  clearZones();

  const b = getBounds();
  if (!b) {
    setStatus("Sem coordenadas válidas para desenhar zonas.");
    return;
  }

  const midLat = (b.minLat + b.maxLat)/2;
  const midLng = (b.minLng + b.maxLng)/2;

  // 4 zonas
  const zones = [
    [[b.minLat,b.minLng],[midLat,midLng]], // SW
    [[b.minLat,midLng],[midLat,b.maxLng]], // SE
    [[midLat,b.minLng],[b.maxLat,midLng]], // NW
    [[midLat,midLng],[b.maxLat,b.maxLng]]  // NE
  ];

  zones.forEach(z=>{

    const rect = L.rectangle([
      [z[0][0],z[0][1]],
      [z[1][0],z[1][1]]
    ],{
      color:"green",
      weight:2,
      fillOpacity:0.1
    }).addTo(map);

    zoneLayers.push(rect);
  });
}

// ==========================================================
// ATRIBUIR ZONAS
// ==========================================================

async function assignZones(){
  let techs = [];
  try {
    const data = await fetchJson("/gps/live");
    techs = Array.isArray(data) ? data : (data.technicians || []);
  } catch (e) {
    setStatus(e.message || "Erro ao carregar técnicos");
    return;
  }

  if (!techs.length){
    setStatus("Sem técnicos disponíveis.");
    return;
  }

  const b = getBounds();
  if (!b) {
    setStatus("Sem coordenadas válidas para atribuir zonas.");
    return;
  }
  const midLat = (b.minLat + b.maxLat)/2;
  const midLng = (b.minLng + b.maxLng)/2;

  const zones = [];

  zones.push(pools.filter(p=>p.latitude <= midLat && p.longitude <= midLng));
  zones.push(pools.filter(p=>p.latitude <= midLat && p.longitude > midLng));
  zones.push(pools.filter(p=>p.latitude > midLat && p.longitude <= midLng));
  zones.push(pools.filter(p=>p.latitude > midLat && p.longitude > midLng));

  techs.forEach((t,i)=>{

    const z = zones[i % zones.length];

    console.log(`👷 ${t.name} → zona ${i}`, z.length,"piscinas");
  });

  setStatus("Zonas atribuídas. Ver consola para detalhe.");
}

// ==========================================================
// LIMPAR
// ==========================================================

function clearZones(){
  zoneLayers.forEach(l=>map.removeLayer(l));
  zoneLayers = [];
}

function clearMap(){
  clearZones();
}

// ==========================================================

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
