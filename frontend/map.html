<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Áreas geográficas — Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css">
<link rel="stylesheet" href="/cw-admin-map.css">
<link rel="stylesheet" href="/cristal-assist.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script></head>
<body data-required-role="ADMIN"><main class="admin-map-page" data-cw-state-managed="manual" data-cw-form-memory="managed">
<h1>Áreas geográficas</h1>
<p>Consulte as piscinas ativas e pré-visualize uma divisão geográfica em quatro áreas. Esta simulação não guarda zonas nem atribui técnicos.</p>
<p>Para gerir atribuições, reveja as rondas, o técnico e as datas em <a href="/admin-rounds">Rotas e rondas</a>.</p>
<a href="/route-map">Consultar sugestão de rota por técnico e dia</a>
<div class="map-controls">

<button id="mapLoad" type="button">Atualizar piscinas</button>
<button id="mapZonesShow" type="button" aria-controls="mapZonesSummary" aria-expanded="false" disabled>Pré-visualizar áreas</button>
<button id="mapZonesHide" type="button" disabled>Retirar áreas</button>
</div>
<p id="mapStatus" role="status" aria-live="polite"></p>
<p id="mapNotice" role="status"></p>
<section id="mapZonesSummary" aria-label="Resumo das áreas geográficas" aria-live="polite" hidden></section>
<div id="map" role="region" aria-label="Mapa com localizações confirmadas"></div>
<div id="mapList"></div>
</main>
<script src="/cw-admin-map.js"></script><script src="/map.js"></script>
<script src="/cristal-help-data.js"></script><script src="/cristal-assist.js"></script><script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script>
</body></html>
