<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Entrada guiada · Cristal Water</title><link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><link rel="stylesheet" href="/cw-onboarding.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script></head>
<body data-required-role="ADMIN"><main id="onboarding" data-cw-state-managed="manual" data-cw-form-memory="managed" data-cw-no-i18n>
<header class="panel"><h1 data-onboard-copy="title">Entrada guiada</h1><p data-onboard-copy="intro"></p><nav class="toolbar"><a class="button" href="/admin-master-control" data-onboard-copy="center">Centro</a><label><span data-onboard-copy="language">Idioma</span><select id="onboardingLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label><button id="refreshOptions" type="button" data-onboard-copy="refresh">Recarregar opções</button></nav></header>
<section class="panel"><p id="onboardingStatus" class="notice" role="status" aria-live="polite"></p><p id="draftStatus" class="muted"></p><p id="legacyDraft" class="notice" data-onboard-copy="legacy" hidden></p><p data-onboard-copy="billingHint"></p><div class="toolbar"><a id="onboardingLogin" href="/login" class="button" data-onboard-copy="login" hidden>Voltar a entrar</a><button id="reloadOnboarding" type="button" data-onboard-copy="reload" hidden>Recarregar página</button><button id="checkOnboarding" type="button" data-onboard-copy="check" hidden>Consultar resultado</button><button id="retryOnboarding" type="button" data-onboard-copy="retry" hidden>Reenviar o mesmo pedido</button></div></section>
<div class="layout"><form id="onboardingForm" novalidate autocomplete="off"><div id="fieldSections"></div><div class="toolbar"><button id="reviewOnboarding" type="submit" data-onboard-copy="review">Rever dados</button><button id="newOnboarding" type="button" data-onboard-copy="reset">Nova ficha</button></div></form>
<aside><section id="onboardingReview" class="panel" hidden><h2 data-onboard-copy="review"></h2><dl id="reviewValues"></dl><label class="check"><input id="confirmOnboarding" type="checkbox"><span data-onboard-copy="confirm"></span></label><p data-onboard-copy="billingHint"></p><button id="saveOnboarding" type="button" data-onboard-copy="save">Confirmar criação</button></section><section id="onboardingResult" class="panel" hidden><h2 data-onboard-copy="created"></h2><dl id="resultValues"></dl><nav id="resultLinks" class="toolbar"></nav></section></aside></div>
<noscript><p>Ative o JavaScript e entre como administrador para criar e confirmar esta entrada.</p><a href="/login">Entrar</a></noscript>
</main><script src="/cw-onboarding-rules.js"></script><script src="/cw-onboarding-copy.js"></script><script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script src="/admin-onboarding.js"></script><script defer src="/ui/design-system.js"></script></body></html>
