<!doctype html>
<html lang="pt">

<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">

<meta charset="utf-8">

<title>
  Cristal Water - Login Cliente
</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>

body {

  margin:0;

  font-family:Arial,sans-serif;

  background:#e3f2fd;

  display:flex;

  align-items:center;

  justify-content:center;

  height:100vh;
}

.login-box {

  background:white;

  padding:30px;

  border-radius:12px;

  box-shadow:0 2px 12px rgba(0,0,0,0.15);

  width:320px;

  text-align:center;
}

.logo {

  font-size:26px;

  font-weight:bold;

  color:#1e88e5;

  margin-bottom:10px;
}

h2 {

  color:#1e88e5;

  margin-bottom:20px;
}

input {

  width:100%;

  padding:12px;

  margin-bottom:12px;

  font-size:14px;

  border-radius:8px;

  border:1px solid #ccc;

  box-sizing:border-box;
}

button {

  width:100%;

  padding:12px;

  background:#1e88e5;

  color:white;

  border:none;

  border-radius:8px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}

button:hover {

  background:#1565c0;
}

.error {

  color:red;

  font-size:13px;

  margin-top:10px;
}

</style>

<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body>

<div class="login-box">

  <div class="logo">
    Cristal Water
  </div>

  <h2>
    Área do Cliente
  </h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="loginBtn">
    Entrar
  </button>

  <div id="error" class="error"></div>

</div>

<script src="/client-login.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
