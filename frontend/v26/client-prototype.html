<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal UI V26 - Cliente</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<header class="cw-hero">
  <h1>🏊 A sua piscina</h1>
  <p>Estado geral simples e claro</p>
</header>

<main class="cw-screen">

  <section class="cw-card">
    <span class="cw-status">Água excelente</span>
    <h2>Piscina principal</h2>
    <p>Última manutenção: hoje</p>
  </section>

  <div class="cw-grid">
    <a class="cw-action" href="#">📷 Ver fotografias</a>
    <a class="cw-action" href="#">📅 Próxima manutenção</a>
    <a class="cw-action" href="#">💳 Pagamentos</a>
    <a class="cw-action" href="#">🕒 Histórico</a>
    <a class="cw-btn cw-btn-primary" href="#">💬 Falar com a Cristal Water</a>
  </div>

</main>

<nav class="cw-bottom">
  <a class="active" href="#">Piscina</a>
  <a href="#">Fotos</a>
  <a href="#">Pagamentos</a>
  <a href="#">Chat</a>
</nav>

</body>
</html>
