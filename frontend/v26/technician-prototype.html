<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal UI V26 - Técnico</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<header class="cw-hero">
  <h1>👷 Técnico</h1>
  <p>Rota de hoje · 8 piscinas</p>
</header>

<main class="cw-screen">

  <section class="cw-card">
    <span class="cw-status">Próxima visita</span>
    <h2>Villa Sunset</h2>
    <p>Lagos · Piscina exterior</p>
  </section>

  <div class="cw-grid">
    <a class="cw-btn cw-btn-primary" href="#">▶️ Iniciar visita</a>
    <a class="cw-action" href="#">📍 Navegar até à piscina</a>
    <a class="cw-action" href="#">📷 Fotografias</a>
    <a class="cw-action" href="#">🧪 Análises da água</a>
    <a class="cw-action" href="#">💧 Produtos usados</a>
    <a class="cw-action" href="#">⚠️ Reportar problema</a>
    <a class="cw-btn cw-btn-primary" href="#">✅ Concluir visita</a>
  </div>

</main>

<nav class="cw-bottom">
  <a class="active" href="#">Hoje</a>
  <a href="#">Mapa</a>
  <a href="#">Chat</a>
  <a href="#">Perfil</a>
</nav>

</body>
</html>
