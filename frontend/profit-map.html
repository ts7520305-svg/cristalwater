<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mapa Lucro Inteligente</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { width:100%; height:100vh; }

.top {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:white;
  padding:10px;
  border-radius:10px;
}

button {
  padding:8px;
  border:none;
  border-radius:6px;
  background:#1e88e5;
  color:white;
  cursor:pointer;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
<link rel="stylesheet" href="/cw-polish.css">
</head>

<body>

<div class="top">
  <button onclick="load()">Atualizar</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const API = "/api";

const map = L.map('map').setView([37.1, -8.6], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

let routeLine;

// ==========================================================
// LOAD ROTA POR LUCRO
// ==========================================================

async function load(){

  const res = await fetch(`${API}/routes/auto-plan`);
  const data = await res.json();

  if (!data.ok) return;

  const plan = data.plans[0]; // 1 técnico

  const coords = [];

  plan.route.forEach(p => {

    const color =
      p.type === "EXTRA" ? "red" :
      p.profit < 0 ? "black" :
      "green";

    L.circleMarker([p.latitude, p.longitude], {
      color,
      radius:8
    })
    .addTo(map)
    .bindPopup(`
      <b>${p.name}</b><br>
      Cliente: ${p.client}<br>
      Lucro: €${p.profit}
    `);

    coords.push([p.latitude, p.longitude]);
  });

  // desenhar linha
  if (routeLine) map.removeLayer(routeLine);

  routeLine = L.polyline(coords,{
    color:"blue",
    weight:4
  }).addTo(map);

  map.fitBounds(routeLine.getBounds());
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script src="/cw-flow-shell.js"></script>
</body>
</html>
