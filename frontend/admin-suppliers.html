<!doctype html>
<html lang="pt"><head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Cristal Water — Fornecedores</title><link rel="manifest" href="/manifest.webmanifest">
 <script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script>
 <link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><link rel="stylesheet" href="/cristal-assist.css"><link rel="stylesheet" href="/cw-suppliers.css">
</head><body data-required-role="ADMIN">
<main id="supplierHub" data-cw-state-managed="manual" data-state="loading" data-cw-form-memory="managed" data-cw-no-i18n>
 <header class="hub-heading"><div><p class="eyebrow">CRISTAL WATER</p><h1 data-supplier-copy="title">Fornecedores</h1><p data-supplier-copy="intro"></p></div><label><span data-supplier-copy="language"></span><select id="supplierLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label></header>
 <nav class="hub-actions"><a href="/admin-master-control" data-destination="/admin-master-control" data-supplier-copy="centre"></a><button id="newSupplier" data-supplier-copy="newSupplier"></button><button id="newLink" data-supplier-copy="newLink"></button></nav>
 <section id="supplierWritePanel" class="hub-panel" aria-labelledby="writeHeading" hidden><h2 id="writeHeading" data-supplier-copy="creation"></h2><p data-supplier-copy="memory" class="muted"></p><p id="writeStatus" role="status" aria-live="polite"></p><p id="writeReference" class="reference"></p>
  <div class="hub-actions"><button id="checkWrite" data-supplier-copy="check" hidden></button><button id="retryWrite" data-supplier-copy="retry" hidden></button><button id="cancelWrite" data-supplier-copy="cancel" hidden></button><button id="nextWrite" data-supplier-copy="next" hidden></button></div><p id="cancelHint" data-supplier-copy="cancelHint" hidden></p>
  <form id="supplierForm" hidden autocomplete="off"><h3 data-supplier-copy="newSupplier"></h3><div id="supplierFields" class="hub-fields"></div><button class="primary" type="submit" data-supplier-copy="saveSupplier"></button></form>
  <form id="linkForm" hidden autocomplete="off"><h3 data-supplier-copy="newLink"></h3><p id="selectedSupplier"></p><button id="clearSupplier" type="button" data-supplier-copy="noSupplier"></button><p class="muted" data-supplier-copy="selectHint"></p><div id="linkFields" class="hub-fields"></div><button class="primary" type="submit" data-supplier-copy="saveLink"></button></form>
 </section>
 <section class="hub-panel" aria-labelledby="directoryHeading"><div class="hub-actions"><h2 id="directoryHeading" data-supplier-copy="directory"></h2><button id="refreshBtn" data-supplier-copy="refresh"></button></div>
  <form id="supplierFilters" class="hub-filters"><label><span data-supplier-copy="search"></span><input id="supplierSearch" maxlength="200" type="search"></label><label><span data-supplier-copy="activity"></span><select id="activeFilter"><option value="true" data-supplier-copy="active"></option><option value="all" data-supplier-copy="all"></option><option value="false" data-supplier-copy="inactive"></option></select></label><button type="submit" data-supplier-copy="apply"></button><button type="button" id="clearSearch" data-supplier-copy="clear"></button></form>
  <p id="supplierStatus" role="status" aria-live="polite"></p><p id="copyStatus" role="status" aria-live="polite"></p>
  <h3 data-supplier-copy="suppliers"></h3><p id="supplierCount"></p><div id="suppliers" class="hub-grid"></div><nav class="hub-actions" aria-label="Fornecedores"><button id="supplierPrevious" data-supplier-copy="previous"></button><span id="supplierPage"></span><button id="supplierNext" data-supplier-copy="following"></button></nav>
  <h3 data-supplier-copy="links"></h3><p id="linkCount"></p><div id="links" class="hub-grid"></div><nav class="hub-actions" aria-label="Atalhos"><button id="linkPrevious" data-supplier-copy="previous"></button><span id="linkPage"></span><button id="linkNext" data-supplier-copy="following"></button></nav>
 </section>
</main>
<script src="/cw-supplier-rules.js"></script><script src="/cw-supplier-copy.js"></script><script src="/admin-suppliers.js"></script>
<script src="/cristal-help-data.js"></script><script src="/cristal-assist.js"></script><script src="/cw-admin-shortcuts.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script>
</body></html>
