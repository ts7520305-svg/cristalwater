<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Segurança e contas · Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script>
<style>
#securityConsole{max-width:1280px;margin:auto;padding:20px;color:#183c46;min-width:0}#securityConsole *{box-sizing:border-box}#securityConsole h1{font-size:clamp(24px,4vw,34px);margin:0}#securityConsole h2{font-size:22px;margin:0 0 14px}#securityConsole .panel,#securityConsole article{background:#fff;color:#183c46;border:1px solid #bed2d8;border-radius:12px;padding:18px;margin:14px 0;min-width:0;overflow-wrap:anywhere}#securityConsole header{backdrop-filter:none}#securityConsole .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px}#securityConsole .columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}#securityConsole .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}#securityConsole .summary div{border:1px solid #bed2d8;border-radius:8px;padding:10px}#securityConsole .summary strong{display:block;font-size:24px}#securityConsole label{display:grid;gap:6px;font-weight:600;margin:12px 0}#securityConsole input,#securityConsole select{width:100%;min-width:0;background:#fff;color:#183c46;border:1px solid #91adb7;border-radius:8px;padding:10px;font:inherit}#securityConsole .confirmation{display:flex;align-items:flex-start;gap:10px}#securityConsole input[type=checkbox]{width:22px;height:22px;flex:none}#securityConsole button,#securityConsole .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid #13716f;border-radius:8px;background:#096665;color:#fff;font:inherit;text-decoration:none;white-space:normal;cursor:pointer;max-width:100%}#securityConsole button:disabled{opacity:.5;cursor:default}#securityConsole :focus-visible{outline:3px solid #087d79;outline-offset:3px}#securityConsole .muted,#securityConsole dt{color:#45636d}#securityConsole dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#securityConsole dd{margin:4px 0 0;font-weight:600;white-space:pre-wrap}#securityConsole .notice{padding:12px;background:#edf6f7;border-radius:8px;overflow-wrap:anywhere}#securityConsole [data-state=error],#securityConsole [data-state=session],#securityConsole [data-state=unknown],#securityConsole [data-state=unconfirmed]{background:#fff0ed;color:#842f20}#securityConsole #securityLanguage{width:auto!important;max-width:100%}#securityConsole [hidden]{display:none!important}
@media(max-width:760px){#securityConsole{padding:12px}#securityConsole .columns{grid-template-columns:1fr}#securityConsole .summary{grid-template-columns:repeat(2,minmax(0,1fr))}#securityConsole .panel,#securityConsole article{padding:14px}}@media(max-width:380px){#securityConsole dl{grid-template-columns:1fr}}
</style></head><body data-required-role="ADMIN"><main id="securityConsole" data-cw-state-managed="manual">
<header class="panel"><h1 data-security-copy="title">Segurança e contas</h1><p data-security-copy="subtitle"></p><nav class="toolbar"><a class="button" href="/admin-master-control" data-security-copy="center">Centro</a><label for="securityLanguage" data-security-copy="language">Idioma</label><select id="securityLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></nav></header>
<section class="panel"><div class="toolbar"><button id="refreshSecurity" type="button" data-security-copy="refresh"></button></div><p id="securityStatus" class="notice" role="status" aria-live="polite"></p><p id="securityChecked" class="muted"></p><div id="securitySummary" class="summary"></div></section>
<div class="columns"><section class="panel" id="resetPanel"><h2 data-security-copy="resetTitle"></h2><form id="lookupForm" autocomplete="off" novalidate><label><span data-security-copy="id"></span><input id="securityUserId" type="text" inputmode="numeric" maxlength="10" autocomplete="off"></label><p class="muted" data-security-copy="idHint"></p><button id="lookupAccount" type="submit" data-security-copy="lookup"></button></form>
<p id="resetStatus" class="notice" role="status" aria-live="polite"></p><div id="accountReview" hidden><dl id="reviewIdentity"></dl><p id="reviewExpiry" class="muted"></p><p class="notice" data-security-copy="effect"></p><p id="selfReset" class="notice" data-security-copy="self" hidden></p>
<form id="passwordForm" autocomplete="off" novalidate><label class="confirmation"><input id="confirmAccount" type="checkbox"><span id="confirmIdentity"></span></label><label><span data-security-copy="password"></span><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" maxlength="144"></label><label><span data-security-copy="repeat"></span><input id="repeatPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="144"></label><p class="muted" data-security-copy="passwordHint"></p><button id="savePassword" type="submit" data-security-copy="save"></button></form></div>
<div id="resetReceipt" hidden></div><div class="toolbar"><button id="checkResult" type="button" data-security-copy="check" hidden></button><button id="clearReview" type="button" data-security-copy="cancel"></button></div></section>
<section class="panel"><h2 data-security-copy="accounts"></h2><p class="muted" data-security-copy="accountBasis"></p><p id="accountPage"></p><nav class="toolbar"><button id="accountFirst" type="button" data-security-copy="first"></button><button id="accountPrevious" type="button" data-security-copy="previous"></button><button id="accountNext" type="button" data-security-copy="next"></button></nav><div id="accountRows" role="list"></div></section></div>
<section class="panel"><h2 data-security-copy="recent"></h2><p class="muted" data-security-copy="auditBasis"></p><div id="securityAudit" role="list"></div></section>
</main><script src="/cw-security-rules.js"></script><script src="/cw-security-copy.js"></script><script src="/admin-security.js"></script><script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script></body></html>
