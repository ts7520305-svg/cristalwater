<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Cristal Water</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e88e5">

<style>
body {
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#1e88e5;
  color:white;
  font-family:Arial;
  flex-direction:column;
  transition:opacity 0.4s ease;
}

.logo {
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.loader {
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid white;
  border-radius:50%;
  width:40px;
  height:40px;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}
</style>

<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
</head>

<body>

<div class="logo">💧 Cristal Water</div>
<div class="loader"></div>

<script>

// ======================================================
// SPLASH → REDIRECT
// ======================================================

setTimeout(() => {

  let user = null;
  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch (_) {
    user = null;
  }

  const token = localStorage.getItem("token") || localStorage.getItem("authToken") || localStorage.getItem("cwAdminToken") || "";
  const role = String(user?.role || "").trim().toUpperCase();
  const hasToken = typeof token === "string" && token.split(".").length === 3;

  if (!user?.id || !hasToken) {
    redirect("/login");
    return;
  }

  if (role === "ADMIN") {
    redirect("/admin-dashboard");
    return;
  }
  if (role === "TECHNICIAN" || role === "TECNICO") {
    redirect("/technician");
    return;
  }
  if (role === "CLIENT") {
    redirect("/client-portal");
    return;
  }

  redirect("/login");

}, 1200);

// ======================================================

function redirect(url){
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = url;
  }, 300);
}

</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
</body>
</html>
