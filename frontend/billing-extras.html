<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<title>Faturação Extras</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#f4f6f8;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

button {
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.confirm {
  background:#2e7d32;
  color:white;
}

.pdf {
  background:#1e88e5;
  color:white;
  margin-left:10px;
}

.total {
  font-size:18px;
  font-weight:bold;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body data-required-role="ADMIN">

<div style="padding:12px 16px 0">
  <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
</div>

<h2>Faturação de Extras</h2>

<div id="list"></div>

<p>Visitas extra concluídas e ainda por incluir numa fatura. Reveja o cliente e o mês em Faturas.</p>
<a class="confirm" href="/invoices" style="display:inline-block;padding:14px;border-radius:8px">Abrir Faturas</a>
<p id="extrasStatus" role="status"></p>
<button type="button" id="extrasReload">Atualizar lista</button>

<script>
let revision=0;
async function load(){
  const version=++revision,token=window.CristalAuth?.getToken?.(),status=document.getElementById('extrasStatus'),list=document.getElementById('list');
  status.textContent='A consultar visitas extra…';
  try{
    const response=await fetch('/api/billing/extras',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(10000)}),data=await response.json();
    if(version!==revision||token!==window.CristalAuth?.getToken?.())return;
    if(!response.ok||data.ok!==true||!data.data||typeof data.data!=='object')throw Error('Não foi possível confirmar os extras. Tente novamente.');
    list.replaceChildren();
    for(const group of Object.values(data.data)){
      const card=document.createElement('section');card.className='card';
      const title=document.createElement('h3');title.textContent=group.client;card.append(title);
      const items=document.createElement('ul');
      for(const item of group.items){const row=document.createElement('li');row.textContent=item.pool+' — '+Number(item.price).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});items.append(row);}
      const total=document.createElement('p');total.className='total';total.textContent='Total por faturar: '+Number(group.total).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
      card.append(items,total);list.append(card);
    }
    status.textContent=list.children.length?'Lista atualizada. A inclusão e o envio são confirmados em Faturas.':'Sem visitas extra concluídas por faturar.';
  }catch(error){if(version===revision&&token===window.CristalAuth?.getToken?.())status.textContent='Lista por confirmar. '+error.message;}
}
document.getElementById('extrasReload').onclick=load;
window.addEventListener('storage',event=>{if(['token','cristalwater_jwt','user','cristalwater_user',null].includes(event.key)){revision++;document.getElementById('list').replaceChildren();document.getElementById('extrasStatus').textContent='A sessão mudou. Atualize a lista.';}});
load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
