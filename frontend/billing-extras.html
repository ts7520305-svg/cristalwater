<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<title>Faturação Extras</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#f4f6f8;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

button {
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.confirm {
  background:#2e7d32;
  color:white;
}

.pdf {
  background:#1e88e5;
  color:white;
  margin-left:10px;
}

.total {
  font-size:18px;
  font-weight:bold;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <script src="/admin-auth-guard.js"></script>
</head>

<body data-required-role="ADMIN">

<div style="padding:12px 16px 0">
  <button type="button" data-cw-back data-cw-fallback="/admin-master-control">Voltar</button>
</div>

<h2>Faturação de Extras</h2>

<div id="list"></div>

<button class="confirm" onclick="confirm()">✔ Confirmar Faturação</button>

<script>
const API = "/api";
const actionLock = new Set();

function authHeaders(extra = {}) {
  const token = localStorage.getItem("token") || localStorage.getItem("cristalwater_jwt");
  return {
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...extra,
  };
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// ==========================================================
// LOAD
// ==========================================================

async function load(){

  const res = await fetch(`${API}/billing/extras`, { headers: authHeaders() });
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!data.ok) return;

  Object.entries(data.data).forEach(([clientId, c]) => {

    list.innerHTML += `
      <div class="card">
        <div class="total">${c.client}</div>

        <ul>
          ${c.items.map(i => `
            <li>${esc(i.pool)} - €${Number(i.price || 0).toFixed(2)}</li>
          `).join("")}
        </ul>

        <div class="total">Total: €${Number(c.total || 0).toFixed(2)}</div>

        <button class="pdf" onclick="openPdf(${clientId})">
          📄 Gerar PDF
        </button>
      </div>
    `;
  });
}

// ==========================================================
// PDF
// ==========================================================

function openPdf(clientId){
  window.open(`${API}/invoice-pdf/extras/${clientId}`);
}

// ==========================================================
// CONFIRMAR
// ==========================================================

async function confirm(){

  if (actionLock.has("confirm")) return;
  const ok = window.confirm("Confirmar faturação de extras visíveis? Esta ação altera estados financeiros.");
  if (!ok) return;
  actionLock.add("confirm");

  try {
    await fetch(`${API}/billing/extras/confirm`, {
      method:"POST",
      headers: authHeaders()
    });

    alert("✔ Extras faturados");
    load();
  } finally {
    actionLock.delete("confirm");
  }
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
</body>
</html>
