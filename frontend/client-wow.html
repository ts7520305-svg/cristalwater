<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cristal Water - Portal do Cliente</title>
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/cw-polish.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#dff7f3,#f8fbff);color:#10202a;font-family:Inter,Segoe UI,Arial,sans-serif}
    .box{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid #dbe9ee;border-radius:8px;padding:22px;box-shadow:0 18px 48px rgba(2,30,42,.16);text-align:center}
    .logo{width:74px;height:74px;border-radius:12px;object-fit:cover;margin-bottom:12px}
    h1{margin:0 0 8px;font-size:24px}
    p{margin:0 0 16px;color:#5f7480;line-height:1.45}
    a{display:inline-flex;min-height:42px;align-items:center;justify-content:center;border-radius:8px;padding:10px 14px;background:linear-gradient(135deg,#007fa0,#00b78a);color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/logo-cristalwater.png" alt="Cristal Water">
    <h1>Portal do Cliente</h1>
    <p>O portal foi unificado. A abrir a area do cliente...</p>
    <a href="/client-portal" id="portalLink">Abrir portal</a>
  </main>
  <script src="/client-wow.js"></script>
  <script src="/cw-flow-shell.js"></script>
</body>
</html>
