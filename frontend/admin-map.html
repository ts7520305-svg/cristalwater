<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }

.panel {
  position:absolute;

  background:white;
  padding:10px;
  border-radius:8px;
  z-index:999;
  width:220px;
}

button {
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#1e88e5;
  color:white;
  border:none;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">

  <button onclick="loadPools()">Todas as Piscinas</button>

  <button onclick="openWaze()">Abrir no Waze</button>
</div>

<div id="map"></div>
