<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075968"><title>Cristal Water — Regras de alerta</title><link rel="stylesheet" href="/cw-operational-risk-rules.css"></head>
<body data-required-role="ADMIN"><main id="riskRulesManager" data-state="loading" data-write-state="idle">
<header class="hub-heading"><div><p class="eyebrow">CRISTAL WATER</p><h1 data-copy="title">Regras de alerta</h1><p data-copy="intro"></p><a id="returnLink" href="/login" data-copy="return">Voltar</a></div><label><span data-copy="language">Idioma</span><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label></header>
<aside class="hub-panel"><p data-copy="automatic"></p><p class="muted" data-copy="memory"></p></aside>
<section id="writePanel" class="hub-panel" aria-labelledby="writeTitle"><h2 id="writeTitle" data-copy="creation"></h2><p id="writeStatus" role="status" aria-live="polite"></p><p id="writeReference" class="reference"></p><dl id="currentFacts"></dl><details id="rawDetails"><summary data-copy="raw"></summary><pre id="rawRecord"></pre></details><button id="refresh" type="button" data-copy="refresh"></button>

<div id="reviewPanel" hidden><h3 data-copy="reviewTitle"></h3><dl id="reviewFacts"></dl><div id="reviewRows" class="hub-grid"></div><p data-copy="automatic"></p><p id="expiry"></p><label class="check"><input id="confirm" type="checkbox"><span data-copy="confirm"></span></label><div class="hub-actions"><button id="save" type="button" class="primary" data-copy="save"></button><button id="backEdit" type="button" data-copy="backEdit"></button></div></div><dl id="receiptFacts"></dl><div class="hub-actions"><button id="check" type="button" data-copy="check" hidden></button><button id="retry" type="button" data-copy="retry" hidden></button><button id="cancel" type="button" data-copy="cancel" hidden></button><button id="next" type="button" data-copy="next" hidden></button><button id="discard" type="button" data-copy="discard" hidden></button></div><p id="cancelHint" data-copy="cancelHint" hidden></p></section>
</main><script src="/cw-vehicle-consumption-rules.js"></script><script src="/cw-vehicle-consumption-copy.js"></script><script src="/cw-operational-risk-rules.js"></script><script src="/cw-operational-risk-rules-copy.js"></script><script src="/cw-operational-risk-rules-page.js"></script></body></html>
