<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ranking Técnicos</title>
  <link rel="stylesheet" href="/ui/foundation.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <style>
    html, body { overflow-x: hidden; }
  </style>
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">
<main style="padding:16px;max-width:960px;margin:0 auto;">
  <h1>Ranking Técnicos</h1>
  <p>Leitura equilibrada de produtividade, qualidade e consistencia operacional no periodo selecionado.</p>
  <p id="status" aria-live="polite">A carregar ranking...</p>
  <div id="ranking" class="card" style="padding:12px;">A carregar ranking...</div>
</main>

<script>
function authHeaders(extra = {}) {
  const token = localStorage.getItem("token") || localStorage.getItem("cristalwater_jwt");
  return {
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...extra,
  };
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

fetch("/api/technician/ranking", { headers: authHeaders() })
.then(r=>r.ok ? r.json() : Promise.reject(new Error("Erro ao carregar ranking")))
.then(data=>{
  let html="";
  (Array.isArray(data) ? data : []).forEach(t=>{
    html+=`
      <div>
        <b>${esc(t.name)}</b><br>
        Feitas: ${Number(t.done || 0)}/${Number(t.total || 0)} |
        ${Number(t.performance || 0)}%
      </div>
      <hr>
    `;
  });
  document.getElementById("ranking").innerHTML=html || "Sem dados de ranking.";
  document.getElementById("status").textContent = "Ranking carregado.";
});
.catch(()=>{
  document.getElementById("ranking").textContent = "Erro ao carregar ranking.";
  document.getElementById("status").textContent = "Erro ao carregar ranking.";
});
</script>
<script src="/crystal-os-v2-shell.js"></script>
<script src="/crystal-os-v2-nav.js"></script>
<script src="/ui/core/navigation-context.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
