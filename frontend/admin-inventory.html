<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cristal Water - Inventario e Stock</title>
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    html, body { overflow-x: hidden; }
    body { margin:0; }
    main.page { padding:20px; max-width:1320px; margin:0 auto; display:grid; gap:14px; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .page-head h1 { margin:0; }
    .page-head p { margin:6px 0 0; color:var(--ds-text-muted); }
    .grid { display:grid; gap:14px; }
    .cols2 { grid-template-columns:minmax(360px,1fr) minmax(360px,1fr); }
    .card h2 { margin:0 0 10px; color:var(--ds-text); }
    .muted, .text-muted { color:var(--ds-text-muted); font-size:13px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .items-grid { display:grid; gap:8px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .list { display:grid; gap:8px; }
    .item { background:var(--ds-surface-soft); border:1px solid var(--ds-border); border-radius:12px; padding:10px; }
    .field-stack {
      display:grid;
      gap:8px;
    }
    .field-stack label {
      font-size:12px;
      font-weight:800;
      color:var(--ds-text-muted);
    }
    .section-gap { margin-top:14px; }
    @media (max-width:1040px) { .cols2,.row { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">
  <main class="page">
    <header class="card page-head">
      <div>
        <h1>Inventario e Stock</h1>
        <p class="text-muted">Entradas, transferencias para viatura, consumos e historico de movimentos.</p>
      </div>
      <div class="actions"><a class="cw-v2-btn" href="/admin-master-control">Centro de Operacoes</a></div>
    </header>

    <div id="inventoryStatus" class="status" role="status" aria-live="polite">A carregar inventario...</div>

    <section class="grid cols2">
      <section class="card">
        <h2>Entrada de stock por fatura</h2>
        <form id="purchaseForm" class="items-grid">
          <div class="field-stack">
            <label for="supplierName">Fornecedor</label>
            <input id="supplierName" name="supplierName" placeholder="Fornecedor" required>
          </div>
          <div class="field-stack">
            <label for="invoiceNumber">Numero da fatura ou documento</label>
            <input id="invoiceNumber" name="invoiceNumber" placeholder="N. fatura / documento">
          </div>
          <div class="row">
            <div class="field-stack">
              <label for="invoiceDate">Data da fatura</label>
              <input id="invoiceDate" name="invoiceDate" type="date">
            </div>
            <div class="field-stack">
              <label for="totalAmount">Total em euros</label>
              <input id="totalAmount" name="totalAmount" type="number" step="0.01" placeholder="Total EUR">
            </div>
          </div>
          <div class="field-stack">
            <label for="document">Documento anexo</label>
            <input id="document" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png">
          </div>
          <h3>Produtos</h3>
          <div id="items" class="items-grid"></div>
          <div class="actions">
            <button type="button" onclick="addRow()">+ Produto</button>
            <button class="cw-v2-btn primary" type="submit">Guardar entrada</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Transferencia para viatura</h2>
        <form id="transferForm" class="items-grid">
          <div class="field-stack">
            <label for="transferVehicleId">ID da viatura</label>
            <input id="transferVehicleId" name="vehicleId" type="number" placeholder="ID da viatura" required>
          </div>
          <div class="field-stack">
            <label for="transferProductName">Produto</label>
            <input id="transferProductName" name="productName" placeholder="Produto" required>
          </div>
          <div class="row">
            <div class="field-stack">
              <label for="transferQuantity">Quantidade</label>
              <input id="transferQuantity" name="quantity" type="number" step="0.01" placeholder="Quantidade" required>
            </div>
            <div class="field-stack">
              <label for="transferUnit">Unidade</label>
              <input id="transferUnit" name="unit" value="KG">
            </div>
          </div>
          <button class="cw-v2-btn primary" type="submit">Transferir</button>
        </form>

        <h2 class="section-gap">Consumo manual</h2>
        <form id="consumeForm" class="items-grid">
          <div class="field-stack">
            <label for="consumeVehicleId">ID da viatura</label>
            <input id="consumeVehicleId" name="vehicleId" type="number" placeholder="ID viatura" required>
          </div>
          <div class="field-stack">
            <label for="consumeProductName">Produto</label>
            <input id="consumeProductName" name="productName" placeholder="Produto" required>
          </div>
          <div class="row">
            <div class="field-stack">
              <label for="consumeQuantity">Quantidade</label>
              <input id="consumeQuantity" name="quantity" type="number" step="0.01" placeholder="Quantidade" required>
            </div>
            <div class="field-stack">
              <label for="consumeUnit">Unidade</label>
              <input id="consumeUnit" name="unit" value="KG">
            </div>
          </div>
          <div class="field-stack">
            <label for="workGuideId">ID guia de obra opcional</label>
            <input id="workGuideId" name="workGuideId" type="number" placeholder="ID guia obra opcional">
          </div>
          <button type="submit">Registar saida</button>
        </form>
      </section>
    </section>

    <section class="card section-gap">
      <h2>Stock atual</h2>
      <div id="stock" class="list"></div>
    </section>

    <section class="card section-gap">
      <h2>Ultimos movimentos</h2>
      <div id="movements" class="list"></div>
    </section>
  </main>

  <script src="/admin-auth-guard.js"></script>
  <script src="/cw-ui-feedback.js"></script>
  <script src="/admin-inventory.js"></script>
  <script src="/cristal-help-data.js"></script>
  <script src="/cristal-assist.js"></script>
  <script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
