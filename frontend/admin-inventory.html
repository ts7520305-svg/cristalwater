<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cristal Water LDA · Stock</title><script src="/cw-auth.js"></script><link rel="stylesheet" href="/cw-polish.css"><style>
:root{--bg:#06111f;--panel:#0d1d31;--panel2:#10243c;--line:#24415f;--txt:#e9f5ff;--muted:#8fb1cc;--brand:#35d1ff;--ok:#40e6a0;--warn:#ffd166;--bad:#ff6b6b;--input:#091829}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#06111f,#0b1f33 55%,#06111f);color:var(--txt);font-family:Inter,Segoe UI,Arial,sans-serif}main.page{padding:24px;max-width:1500px;margin:0 auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.page-head h1{margin:0;font-size:30px}.page-head p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.cols2{grid-template-columns:minmax(320px,430px) 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.card{background:rgba(13,29,49,.92);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.metric{font-size:32px;font-weight:900}.label,.muted{color:var(--muted);font-size:13px}.item,.client,.pool,.visit,.tech,.round-card,.day-card{background:#0a1b2e;border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;color:var(--txt)}input,select,textarea{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0}textarea{min-height:75px}button,.btn{border:0;border-radius:14px;padding:12px 16px;background:#163354;color:var(--txt);font-weight:800;cursor:pointer;margin:4px 0}button.primary,.btn.primary{background:linear-gradient(135deg,#0584c7,#35d1ff);color:#03121c}button.ok,.btn.ok{background:linear-gradient(135deg,#0c9f69,#40e6a0);color:#02150d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.list{display:grid;gap:10px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:#bfe4ff;background:#0a1b2e;font-size:12px}.status{border:1px solid rgba(53,217,255,.18);background:rgba(53,217,255,.08);padding:12px;border-radius:16px;color:#cfe9ff}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{min-width:120px;text-align:center}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.quick-card{display:block;background:rgba(13,29,49,.92);border:1px solid var(--line);border-radius:20px;padding:18px;color:var(--txt);text-decoration:none}.quick-card strong{display:block;font-size:17px}.quick-card span{display:block;margin-top:5px;color:var(--muted);font-size:12px}@media(max-width:1000px){main.page{padding:14px}.cols2,.cols3,.cols4,.row,.row3{grid-template-columns:1fr}.page-head{flex-direction:column}}
</style></head><body><main class="page"><div class="page-head"><div><h1>Stock</h1><p>Compras, stock central, transferências para viaturas e consumos.</p></div><div class="actions"><a class="btn" href="/admin-master-control">Centro de Operações</a></div></div>
<section class="grid cols2"><section class="card"><h2>Entrada de stock por fatura</h2><form id="purchaseForm"><input name="supplierName" placeholder="Fornecedor"><input name="invoiceNumber" placeholder="N.º fatura / documento"><input name="invoiceDate" type="date"><input name="totalAmount" type="number" step="0.01" placeholder="Total €"><input name="document" type="file" accept=".pdf,.jpg,.jpeg,.png"><h3>Produtos</h3><div id="items"></div><button type="button" onclick="addRow()">+ Produto</button><button class="primary" type="submit">Guardar entrada</button></form></section><section class="card"><h2>Transferir para viatura</h2><form id="transferForm"><input name="vehicleId" type="number" placeholder="ID da viatura"><input name="productName" placeholder="Produto"><input name="quantity" type="number" step="0.01" placeholder="Quantidade"><input name="unit" value="KG"><button class="primary">Transferir</button></form><h2>Consumo manual</h2><form id="consumeForm"><input name="vehicleId" type="number" placeholder="ID viatura"><input name="productName" placeholder="Produto"><input name="quantity" type="number" step="0.01" placeholder="Quantidade"><input name="unit" value="KG"><input name="workGuideId" type="number" placeholder="ID guia obra opcional"><button>Registar saída</button></form></section></section><section class="card" style="margin-top:18px"><h2>Stock atual</h2><div id="stock" class="list"></div></section><section class="card" style="margin-top:18px"><h2>Últimos movimentos</h2><div id="movements" class="list"></div></section></main><script src="/admin-auth-guard.js"></script><script src="/admin-inventory.js"></script><script src="/cristal-help-data.js"></script><script src="/cristal-assist.js"></script><script src="/cw-flow-shell.js"></script></body></html>
