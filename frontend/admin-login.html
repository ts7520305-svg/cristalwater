<!doctype html>
<html lang="pt">

<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">

<meta charset="utf-8">

<title>
  Login Administração
</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>

body{

  margin:0;

  font-family:Arial;

  background:#eef3f8;

  display:flex;

  justify-content:center;

  align-items:center;

  height:100vh;
}

.box{

  background:white;

  padding:30px;

  border-radius:12px;

  width:320px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.1);
}

h2{

  margin-top:0;

  color:#1e88e5;
}

input{

  width:100%;

  padding:12px;

  margin-bottom:12px;

  border-radius:8px;

  border:1px solid #ccc;

  box-sizing:border-box;
}

button{

  width:100%;

  padding:12px;

  border:none;

  border-radius:8px;

  background:#1e88e5;

  color:white;

  font-weight:bold;

  cursor:pointer;
}

button:hover{

  background:#1565c0;
}

#error{

  margin-top:10px;

  color:red;

  font-size:14px;
}

</style>

<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body>

<div class="box">

<h2>
  Administração
</h2>

<input
  id="email"
  placeholder="Email"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button id="loginBtn">
  Entrar
</button>

<div id="error"></div>

</div>

<script src="/admin-login.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
