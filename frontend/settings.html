<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Configurações de Notificações</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#050b16;color:#e8f7ff}
main{max-width:980px;margin:0 auto;padding:18px}
.panel{border:1px solid rgba(53,217,255,.24);border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(16,32,54,.9),rgba(8,18,32,.95));box-shadow:0 24px 70px rgba(0,0,0,.38)}
h1{margin:0 0 6px;font-size:28px}
.muted{margin:0 0 16px;color:#9db4c9}
.card{background:rgba(255,255,255,.055);padding:14px;margin-bottom:10px;border-radius:16px;border:1px solid rgba(255,255,255,.12)}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.chip{display:inline-flex;padding:4px 8px;border-radius:999px;border:1px solid rgba(53,217,255,.3);font-size:12px;color:#9ddfff}
.settings-actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.settings-actions button,.settings-actions a,#list select{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid #8caec4;font:inherit}.settings-actions a{background:#e8f7ff;color:#102620;text-decoration:none}#list select{max-width:100%;background:#fff;color:#102620}.card small{display:block;margin-top:8px}#settingsStatus{overflow-wrap:anywhere}
@media(max-width:700px){main{padding:14px}h1{font-size:24px}}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/client-auth-guard.js"></script>
  <link rel="stylesheet" href="/ui/foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>

<body>

<div style="padding:12px 16px 0">
  <button type="button" data-cw-back data-cw-fallback="/client-menu">Voltar</button>
</div>

<main>
  <section class="panel" data-help-topic="settings" data-cw-no-i18n>
    <span class="chip" id="settingsLabel">Notificações</span>
    <h1 id="settingsTitle">Preferências de som</h1>
    <p class="muted" id="settingsIntro">Consulte e guarde preferências associadas à sua conta.</p>
    <p id="settingsStatus" role="status" aria-live="polite">A carregar preferências…</p>
    <div class="settings-actions"><button id="settingsReload" type="button">Atualizar preferências</button><a id="settingsNotices" href="/client-notifications">Ver notificações</a></div>
    <div id="list" aria-busy="true"></div>
  </section>
</main>

<script src="/account-notification-settings.js"></script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
