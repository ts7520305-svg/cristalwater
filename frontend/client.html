<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<title>Clientes</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { background:white; padding:15px; margin-bottom:10px; border-radius:10px; }
button { padding:8px 12px; margin-top:5px; cursor:pointer; }
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
<link rel="stylesheet" href="/cw-polish.css">
  <link rel="stylesheet" href="css/crystal-v25.css">
</head>

<body>

<h1>Clientes</h1>

<div id="list"></div>

<script>
const API = "/api";

async function load() {
  const res = await fetch(API + "/clients");
  const data = await res.json();

  const container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(c => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${c.name}</b><br/>
      Zona: ${c.zone || "-"}<br/>
      Fatura: ${c.requiresInvoice ? "SIM" : "NÃO"}<br/>

      <button onclick="toggle(${c.id}, ${c.requiresInvoice})">
        ${c.requiresInvoice ? "Remover faturação" : "Marcar para faturar"}
      </button>

      <button onclick="createInvoice(${c.id})">
        Criar cobrança
      </button>
    `;

    container.appendChild(div);
  });
}

async function toggle(id, current) {
  await fetch(API + "/clients/" + id, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      requiresInvoice: !current
    })
  });

  load();
}

async function createInvoice(id) {
  await fetch(API + "/invoices/generate-for-client/" + id, {
    method: "POST"
  });

  alert("Cobrança criada");
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-flow-shell.js"></script>
</body>
</html>
