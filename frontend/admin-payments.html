<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
  <meta charset="UTF-8" />
  <title>Cristal Water - Pagamentos Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    html, body { overflow-x: hidden; }
    .finance-shell {
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .finance-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .finance-head h1 { margin: 0; }
    .finance-nav,
    .finance-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .finance-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 210px auto;
      align-items: center;
    }
    .finance-filters {
      display: grid;
      gap: 8px;
    }
    .finance-filters label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ds-text-muted);
    }
    @media (max-width: 920px) {
      .finance-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">

  <main>
    <section class="finance-shell page">
      <header class="card finance-head">
        <div>
          <h1>Pagamentos</h1>
          <p class="text-muted">Controlo de pagamentos, filtros por metodo e acesso rapido ao cliente.</p>
        </div>
        <div class="finance-nav">
          <a class="cw-v2-btn" href="/admin-master-control">Centro</a>
          <a class="cw-v2-btn" href="/admin-notifications">Notificacoes</a>
          <a class="cw-v2-btn" href="/billing-center">Cobrancas</a>
        </div>
      </header>

      <section class="card">
    <div class="finance-toolbar">
      <div class="finance-filters">
        <label for="paymentSearch">Pesquisa</label>
        <input id="paymentSearch" type="search" placeholder="Pesquisar cliente, referencia ou metodo">
      </div>
      <div class="finance-filters">
        <label for="paymentMethodFilter">Metodo de pagamento</label>
        <select id="paymentMethodFilter">
          <option value="">Todos os metodos</option>
          <option value="MBWAY">MB WAY</option>
          <option value="TRANSFER">Transferencia</option>
          <option value="CASH">Numerario</option>
          <option value="CARD">Cartao</option>
        </select>
      </div>
      <button class="cw-v2-btn primary" id="refreshPayments" type="button"><span>Atualizar</span></button>
    </div>
    <div id="paymentsStatus" class="status" role="status" aria-live="polite">A carregar pagamentos...</div>
    <div id="tableBox"></div>
      </section>
    </section>
  </main>

  <script src="/admin-payments.js"></script>
<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
<script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
