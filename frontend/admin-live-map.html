<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Posições dos técnicos · Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script>
<style>
#livePositions{max-width:1280px;margin:auto;padding:20px;min-width:0;color:#183c46}#livePositions *{box-sizing:border-box}#livePositions h1{margin:0;font-size:clamp(24px,4vw,34px)}
#livePositions .panel,#livePositions .position-card{background:#fff;color:#183c46;border:1px solid #bed2d8;border-radius:12px;padding:18px;margin:14px 0;min-width:0;overflow-wrap:anywhere}
#livePositions .toolbar,#livePositions .pagination,#livePositions .card-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#livePositions .card-head{justify-content:space-between}#livePositions h2{font-size:19px;margin:0}
#livePositions .filters{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end}#livePositions label{display:grid;gap:5px;min-width:0;font-weight:600}
#livePositions input,#livePositions select{width:100%;min-width:0;color:#183c46;background:#fff;border:1px solid #91adb7;padding:10px;border-radius:8px}
#livePositions button,#livePositions .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid #13716f;border-radius:8px;background:#096665;color:#fff;text-decoration:none;white-space:normal;max-width:100%;font:inherit;cursor:pointer}
#livePositions button:disabled{opacity:.5;cursor:default}#livePositions :focus-visible{outline:3px solid #087d79;outline-offset:3px}#livePositions .muted,#livePositions dt{color:#45636d}
#livePositions .summary,#livePositions dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}#livePositions .summary strong{display:block;font-size:23px;margin-top:5px}#livePositions dd{margin:4px 0 0;font-weight:600}#livePositions .amount{font-size:23px}#livePositions .note{padding:10px;background:#edf6f7;border-radius:8px}
#positionStatus{padding:12px;background:#edf6f7;border-radius:8px;scroll-margin-top:125px}#positionStatus[data-state=error],#positionStatus[data-state=invalid],#positionStatus[data-state=session]{background:#fff0ed;color:#842f20}
#positionLanguage{width:auto!important}#livePositions .pagination{margin:12px 0}
@media(max-width:650px){#livePositions{padding:12px}#livePositions .filters,#livePositions .summary,#livePositions dl{grid-template-columns:1fr}#livePositions .panel,#livePositions .position-card{padding:14px}}

#livePositions > header{backdrop-filter:none}
#positionMap{height:390px;max-width:100%;margin:12px 0;border-radius:10px}#livePositions .toggle{display:flex;align-items:center;gap:10px;margin:14px 0}#livePositions .toggle input{width:22px;height:22px}#livePositions .position-state{font-weight:700}
</style></head><body data-required-role="ADMIN">
<main id="livePositions" data-cw-state-managed="manual">
<header class="panel"><h1 data-position-copy="title">Posições dos técnicos</h1><p class="muted" data-position-copy="subtitle"></p>
<nav class="toolbar"><a class="button" href="/admin-master-control" data-position-copy="center">Centro</a><a class="button" href="/multi-map" data-position-copy="visits">Visitas do dia</a><a class="button" href="/admin-alerts" data-position-copy="alerts">Alertas operacionais</a><a class="button" href="/admin-map" data-position-copy="pools">Piscinas</a>
<label for="positionLanguage" data-position-copy="language">Idioma</label><select id="positionLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></nav></header>
<section class="panel"><form id="positionFilters" class="filters" autocomplete="off" novalidate>
<label><span data-position-copy="search">Pesquisa</span><input id="positionSearch" type="search" maxlength="120"></label>
<label><span data-position-copy="positionState">Estado da posição</span><select id="positionState"><option value="" data-position-copy="all">Todos</option><option value="RECENT" data-position-copy="RECENT"></option><option value="STALE" data-position-copy="STALE"></option><option value="MISSING" data-position-copy="MISSING"></option><option value="INVALID" data-position-copy="INVALID"></option><option value="FUTURE" data-position-copy="FUTURE"></option></select></label>
<button id="refreshPositions" type="submit" data-position-copy="refresh">Atualizar</button></form>
<label class="toggle"><input id="positionAuto" type="checkbox" checked><span data-position-copy="auto"></span></label>
<p class="muted" data-position-copy="basis"></p><p class="note" data-position-copy="identityNote"></p>
<div id="positionStatus" role="status" aria-live="polite">A confirmar posições…</div><p id="positionChecked" class="muted"></p>
<div class="summary"><div><span data-position-copy="total"></span><strong id="positionTotal">—</strong></div><div><span data-position-copy="recentTotal"></span><strong id="positionRecent">—</strong></div><div><span data-position-copy="otherTotal"></span><strong id="positionOther">—</strong></div></div>
<p id="positionMapNotice" role="status"></p><button id="reloadPositionMap" type="button" data-position-copy="retryMap"></button><div id="positionMap" role="region" aria-label="Mapa GPS" hidden></div>
<nav class="pagination"><button id="positionFirst" type="button" data-position-copy="first"></button><button id="positionPrevious" type="button" data-position-copy="previous"></button><button id="positionNext" type="button" data-position-copy="next"></button></nav>
<div id="positionRows" role="list"></div>
<nav class="pagination"><button id="positionFirstBottom" type="button" data-position-copy="first"></button><button id="positionPreviousBottom" type="button" data-position-copy="previous"></button><button id="positionNextBottom" type="button" data-position-copy="next"></button></nav>
</section></main>
<script src="/cw-live-map-rules.js"></script><script src="/cw-payment-ledger-copy.js"></script><script src="/cw-live-map-copy.js"></script><script src="/admin-live-map.js"></script>
<script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script>
</body></html>
