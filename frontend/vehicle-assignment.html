<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075968"><title>Cristal Water — Atribuição de viaturas</title><link rel="stylesheet" href="/cw-vehicle-assignment.css"></head>
<body data-required-role="ADMIN"><main id="assignmentManager" data-state="loading" data-write-state="idle">
<header class="hub-heading"><div><p class="eyebrow">CRISTAL WATER</p><h1 data-copy="title">Atribuição de viaturas</h1><p data-copy="intro"></p><a id="returnLink" href="/login" data-copy="return">Voltar</a></div><label><span data-copy="language">Idioma</span><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label></header>
<aside class="hub-panel"><p data-copy="automatic"></p><p class="muted" data-copy="memory"></p></aside>
<section class="hub-panel" aria-labelledby="directoryTitle"><h2 id="directoryTitle" data-copy="directory"></h2><p id="listStatus" role="status" aria-live="polite"></p><form id="filters" class="hub-filters"><label><span data-copy="search"></span><input id="search" type="search" maxlength="200"></label><label><span data-copy="technicianId"></span><input id="technicianIdFilter" inputmode="numeric" maxlength="10"></label><button type="submit" data-copy="apply"></button><button id="clearSearch" type="button" data-copy="clear"></button></form><p id="count"></p><div id="guideList" class="hub-grid"></div><div class="hub-actions"><button id="previous" type="button" data-copy="previous"></button><span id="page"></span><button id="following" type="button" data-copy="following"></button><button id="refresh" type="button" data-copy="refresh"></button></div></section>
<section id="writePanel" class="hub-panel" hidden aria-labelledby="writeTitle"><h2 id="writeTitle" data-copy="creation"></h2><p id="writeStatus" role="status" aria-live="polite"></p><p id="targetIdentity"></p><p id="writeReference" class="reference"></p><dl id="currentFacts"></dl><a id="workLink" href="/work-guide-close" data-copy="workLink"></a>
<div id="editor"><div class="hub-filters"><label><span data-copy="vehicleSearch"></span><input id="vehicleSearch" type="search" maxlength="200"></label><button id="findVehicle" type="button" data-copy="apply"></button></div><p id="vehicleStatus" role="status"></p><div class="hub-actions"><button id="previousVehicle" type="button" data-copy="previous"></button><span id="vehiclePage"></span><button id="followingVehicle" type="button" data-copy="following"></button></div>
<form id="consumeForm" novalidate><label><span data-copy="after"></span><select id="destination"></select></label><p id="selectedVehicle"></p><label><span data-copy="kmMode"></span><select id="kmMode"><option value="KEEP" data-copy="KEEP"></option><option value="SET" data-copy="SET"></option></select></label><p id="kmSelection"></p><label><span data-copy="km"></span><input id="km" inputmode="decimal" maxlength="20" autocomplete="off"></label><p data-copy="kmHint"></p><label><span data-copy="notes"></span><textarea id="notes" maxlength="2000" autocomplete="off"></textarea></label><button id="prepare" type="submit" class="primary" data-copy="prepare"></button></form></div>
<div id="reviewPanel" hidden><h3 data-copy="reviewTitle"></h3><dl id="reviewFacts"></dl><p data-copy="automatic"></p><p id="expiry"></p><label class="check"><input id="confirm" type="checkbox"><span data-copy="confirm"></span></label><div class="hub-actions"><button id="save" type="button" class="primary" data-copy="save"></button><button id="backEdit" type="button" data-copy="backEdit"></button></div></div><dl id="receiptFacts"></dl><div class="hub-actions"><button id="check" type="button" data-copy="check" hidden></button><button id="retry" type="button" data-copy="retry" hidden></button><button id="cancel" type="button" data-copy="cancel" hidden></button><button id="next" type="button" data-copy="next" hidden></button><button id="discard" type="button" data-copy="discard" hidden></button></div><p id="cancelHint" data-copy="cancelHint" hidden></p></section>
</main><script src="/cw-vehicle-consumption-rules.js"></script><script src="/cw-vehicle-consumption-copy.js"></script><script src="/cw-vehicle-assignment-rules.js"></script><script src="/cw-vehicle-assignment-copy.js"></script><script src="/cw-vehicle-assignment.js"></script></body></html>
