<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cristal Water — Documentos da guia</title><link rel="stylesheet" href="/cw-transport-guide-create.css"></head><body data-required-role="ADMIN"><main id="transportCreator" data-state="loading" data-write-state="idle">
