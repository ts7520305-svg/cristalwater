<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075968"><title>Cristal Water — Manutenção da frota</title>
  <link rel="stylesheet" href="/cw-vehicle-maintenance.css">
</head>
<body>
<main id="maintenanceManager" data-state="loading" data-write-state="idle">
  <header class="hub-heading"><div><p class="eyebrow">CRISTAL WATER</p><h1 data-copy="title">Manutenção da frota</h1><p data-copy="intro"></p><a id="returnLink" href="/login" data-copy="return">Voltar</a></div><label><span data-copy="language">Idioma</span><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></label></header>
  <aside class="hub-panel"><p data-copy="automatic"></p><p class="muted" data-copy="memory"></p></aside>
  <section class="hub-panel" aria-labelledby="directoryTitle"><h2 id="directoryTitle" data-copy="directory"></h2><p id="listStatus" role="status" aria-live="polite"></p>
    <form id="filters" class="hub-filters"><label><span data-copy="directoryKind"></span><select id="directoryKind"><option value="records" data-copy="records"></option><option value="vehicles" data-copy="vehicles"></option></select></label><label><span data-copy="search"></span><input id="search" type="search" maxlength="200"></label><label><span data-copy="vehicleId"></span><input id="vehicleIdFilter" inputmode="numeric" maxlength="10"></label><label><span data-copy="maintenanceId"></span><input id="maintenanceIdFilter" inputmode="numeric" maxlength="10"></label><button type="submit" data-copy="apply"></button><button id="clearSearch" type="button" data-copy="clear"></button></form>
    <p id="count"></p><div id="guideList" class="hub-grid"></div><div class="hub-actions"><button id="previous" type="button" data-copy="previous"></button><span id="page"></span><button id="following" type="button" data-copy="following"></button><button id="refresh" type="button" data-copy="refresh"></button></div>
  </section>
  <section id="writePanel" class="hub-panel" hidden aria-labelledby="writeTitle"><h2 id="writeTitle" data-copy="creation"></h2><p id="writeStatus" role="status" aria-live="polite"></p><p id="targetIdentity"></p><p id="writeReference" class="reference"></p>
    <dl id="currentFacts"></dl>
    <form id="consumeForm" novalidate><label><span data-copy="operation"></span><select id="operation"><option value="CREATE" hidden data-copy="CREATE"></option><option value="EDIT" data-copy="EDIT"></option><option value="COMPLETE" data-copy="COMPLETE"></option></select></label><p data-copy="dateHint"></p><div id="maintenanceFields" class="hub-grid"></div><label><span data-copy="notes"></span><textarea id="notes" maxlength="2000" autocomplete="off"></textarea></label><button type="submit" class="primary" data-copy="prepare"></button></form>
    <div id="reviewPanel" hidden><h3 data-copy="reviewTitle"></h3><dl id="reviewFacts"></dl><div id="reviewRows" class="hub-grid"></div><p data-copy="automatic"></p><p id="expiry"></p><label class="check"><input id="confirm" type="checkbox"><span data-copy="confirm"></span></label><div class="hub-actions"><button id="save" type="button" class="primary" data-copy="save"></button><button id="backEdit" type="button" data-copy="backEdit"></button></div></div>
    <a id="expenseLink" href="/admin-expenses" data-copy="expenseLink"></a>
    <dl id="receiptFacts"></dl><div class="hub-actions"><button id="check" type="button" data-copy="check" hidden></button><button id="retry" type="button" data-copy="retry" hidden></button><button id="cancel" type="button" data-copy="cancel" hidden></button><button id="next" type="button" data-copy="next" hidden></button><button id="discard" type="button" data-copy="discard" hidden></button></div><p id="cancelHint" data-copy="cancelHint" hidden></p>
  </section>
</main>
<script src="/cw-vehicle-consumption-rules.js"></script><script src="/cw-vehicle-consumption-copy.js"></script><script src="/cw-onboarding-rules.js"></script><script src="/cw-vehicle-maintenance-rules.js"></script><script src="/cw-vehicle-maintenance-copy.js"></script><script src="/cw-vehicle-maintenance.js"></script>
</body></html>
