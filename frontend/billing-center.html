<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Centro de cobranças · Cristal Water</title>
<link rel="stylesheet" href="/ui/foundation.css"><link rel="stylesheet" href="/ui/design-system.css"><script src="/cw-auth.js"></script><script src="/admin-auth-guard.js"></script>
<style>
#collectionSummary{max-width:1280px;margin:auto;padding:20px;min-width:0;color:#183c46}#collectionSummary *{box-sizing:border-box}#collectionSummary h1{margin:0;font-size:clamp(24px,4vw,34px)}
#collectionSummary .panel,#collectionSummary .collection-card{background:#fff;color:#183c46;border:1px solid #bed2d8;border-radius:12px;padding:18px;margin:14px 0;min-width:0;overflow-wrap:anywhere}
#collectionSummary .toolbar,#collectionSummary .pagination,#collectionSummary .card-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#collectionSummary .card-head{justify-content:space-between}#collectionSummary h2{font-size:19px;margin:0}
#collectionSummary .filters{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end}#collectionSummary label{display:grid;gap:5px;min-width:0;font-weight:600}
#collectionSummary input,#collectionSummary select{width:100%;min-width:0;color:#183c46;background:#fff;border:1px solid #91adb7;padding:10px;border-radius:8px}
#collectionSummary button,#collectionSummary .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid #13716f;border-radius:8px;background:#096665;color:#fff;text-decoration:none;white-space:normal;max-width:100%;font:inherit;cursor:pointer}
#collectionSummary button:disabled{opacity:.5;cursor:default}#collectionSummary :focus-visible{outline:3px solid #087d79;outline-offset:3px}#collectionSummary .muted,#collectionSummary dt{color:#45636d}
#collectionSummary .summary,#collectionSummary dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}#collectionSummary .summary strong{display:block;font-size:23px;margin-top:5px}#collectionSummary dd{margin:4px 0 0;font-weight:600}#collectionSummary .amount{font-size:23px}#collectionSummary .note{padding:10px;background:#edf6f7;border-radius:8px}
#billingStatus{padding:12px;background:#edf6f7;border-radius:8px;scroll-margin-top:125px}#billingStatus[data-state=error],#billingStatus[data-state=invalid],#billingStatus[data-state=session]{background:#fff0ed;color:#842f20}
#collectionLanguage{width:auto!important}#collectionSummary .pagination{margin:12px 0}
@media(max-width:650px){#collectionSummary{padding:12px}#collectionSummary .filters,#collectionSummary .summary,#collectionSummary dl{grid-template-columns:1fr}#collectionSummary .panel,#collectionSummary .collection-card{padding:14px}}
</style></head><body data-required-role="ADMIN">
<main id="collectionSummary" data-cw-state-managed="manual">
<header class="panel"><h1 data-collection-copy="title">Centro de cobranças</h1><p class="muted" data-collection-copy="subtitle"></p>
<nav class="toolbar"><a class="button" href="/admin-master-control" data-collection-copy="center">Centro</a><a class="button" href="/admin-payments" data-collection-copy="payments">Pagamentos</a><a class="button" href="/invoices" data-collection-copy="documents">Documentos</a>
<label for="collectionLanguage" data-collection-copy="language">Idioma</label><select id="collectionLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></nav></header>
<section class="panel"><form id="collectionFilters" class="filters" autocomplete="off" novalidate>
<label><span data-collection-copy="search">Pesquisa</span><input id="collectionSearch" type="search" maxlength="120"></label>
<label><span data-collection-copy="paymentStatus">Estado do pagamento</span><select id="collectionStatus"><option value="" data-collection-copy="all">Todos</option><option value="PENDING" data-collection-copy="PENDING">Por pagar</option><option value="OVERDUE" data-collection-copy="OVERDUE">Em atraso</option></select></label>
<button id="refreshCollection" type="submit" data-collection-copy="refresh">Atualizar</button></form>
<p class="muted" data-collection-copy="basis"></p><p class="muted" data-collection-copy="creditNote"></p>
<div id="billingStatus" role="status" aria-live="polite">A confirmar cobranças…</div><p id="collectionChecked" class="muted"></p>
<div class="summary"><div><span data-collection-copy="clients">Clientes com dívida</span><strong id="sumDebtors">—</strong></div><div><span data-collection-copy="openTotal">Total em aberto</span><strong id="sumOpen">—</strong></div><div><span data-collection-copy="openDocuments">Documentos em aberto</span><strong id="sumInvoices">—</strong></div></div><p id="overdueSummary" class="note"></p>
<nav class="pagination"><button id="collectionFirst" type="button" data-collection-copy="first"></button><button id="collectionPrevious" type="button" data-collection-copy="previous"></button><button id="collectionNext" type="button" data-collection-copy="next"></button></nav>
<div id="tableBox" role="list"></div>
<nav class="pagination"><button id="collectionFirstBottom" type="button" data-collection-copy="first"></button><button id="collectionPreviousBottom" type="button" data-collection-copy="previous"></button><button id="collectionNextBottom" type="button" data-collection-copy="next"></button></nav>
</section></main>
<script src="/cw-collection-summary-rules.js"></script><script src="/cw-payment-ledger-copy.js"></script><script src="/cw-collection-summary-copy.js"></script><script src="/billing-center.js"></script>
<script src="/ui/core/navigation-context.js"></script><script src="/crystal-os-v2-shell.js"></script><script src="/crystal-os-v2-nav.js"></script><script defer src="/ui/design-system.js"></script>
</body></html>
