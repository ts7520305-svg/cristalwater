<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
<meta charset="UTF-8">
<title>Histórico Faturação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#f4f6f8;
}

h2 {
  margin-bottom:20px;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.client {
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.total {
  font-weight:bold;
  margin-top:10px;
  color:#1e88e5;
}

.item {
  font-size:14px;
  margin-left:10px;
}

.date {
  color:#666;
  font-size:12px;
}
</style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
<link rel="stylesheet" href="/cw-polish.css">
</head>

<body>

<h2>Histórico de Faturação (Extras)</h2>

<div id="list"></div>

<script>
const API = "/api";

// ==========================================================
// LOAD
// ==========================================================

async function load(){

  const res = await fetch(`${API}/billing/extras/history`);
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!data.ok) {
    list.innerHTML = "<p>Erro ao carregar dados</p>";
    return;
  }

  Object.values(data.data).forEach(c => {

    list.innerHTML += `
      <div class="card">
        <div class="client">👤 ${c.client}</div>

        ${c.items.map(i => `
          <div class="item">
            🏊 ${i.pool} - €${i.price}
            <div class="date">
              ${new Date(i.date).toLocaleDateString("pt-PT")}
            </div>
          </div>
        `).join("")}

        <div class="total">
          Total: €${c.total.toFixed(2)}
        </div>
      </div>
    `;
  });
}

load();
</script>

<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-flow-shell.js"></script>
</body>
</html>
