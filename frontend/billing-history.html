<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050b16">
  <meta charset="UTF-8" />
  <title>Cristal Water · Histórico de extras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/ui/foundation.css">
  <style>
    html, body { overflow-x: hidden; }
    .finance-shell {
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .finance-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .finance-head h1 { margin: 0; }
    .finance-nav,
    .finance-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .finance-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 210px auto;
      align-items: center;
    }
    .finance-filters {
      display: grid;
      gap: 8px;
    }
    .finance-filters label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ds-text-muted);
    }
    #extraHistory{max-width:1440px;margin:auto;min-width:0;color:#183c46}
    #extraHistory .card{min-width:0;background:#fff;color:#183c46}
    #extraHistory .finance-toolbar{grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}
    #extraHistory input,#extraHistory select{width:100%;min-width:0;color:#183c46;background:#fff;border:1px solid #91adb7}
    #extraHistory .finance-filters label,#extraHistory .text-muted{color:#45636d}
    #extraHistory :focus-visible{outline:3px solid #087d79;outline-offset:3px}
    #extraHistory button:disabled{opacity:.5;cursor:default}
    #extraHistory .extra-pagination{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
    #extraHistory #extrasStatus{padding:12px;background:#edf6f7;color:#194c59;border-radius:8px;scroll-margin-top:125px}
    #extraHistory #extrasStatus[data-state=error],#extraHistory #extrasStatus[data-state=invalid],#extraHistory #extrasStatus[data-state=session]{background:#fff0ed;color:#842f20}
    #extraHistory #tableBox{display:grid;gap:12px;min-width:0}
    #extraHistory .extra-card{border:1px solid #bed2d8;border-radius:12px;padding:16px;min-width:0;overflow-wrap:anywhere}
    #extraHistory .extra-card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    #extraHistory .extra-card h2{font-size:18px;margin:0}#extraHistory .extra-amount{font-size:21px}
    #extraHistory .extra-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
    #extraHistory dt{color:#45636d;font-size:13px}#extraHistory dd{margin:3px 0 0;font-weight:600}
    #extraHistory details{margin:10px 0}#extraHistory summary{cursor:pointer;font-weight:700}
    #extraHistory .extra-notes{white-space:pre-wrap}#extraHistory .extra-review{padding:10px;background:#fff6df;color:#644313;border-radius:8px}
    #extraHistory .extra-credit{font-weight:700;color:#075a67}#extraHistory .extra-card .cw-v2-btn{margin-top:8px;white-space:normal;max-width:100%}
    @media(max-width:600px){#extraHistory{padding:10px}#extraHistory .finance-toolbar,#extraHistory .extra-facts{grid-template-columns:1fr}#extraHistory .card{padding:14px}}
    @media (max-width: 920px) {
      .finance-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
<link rel="stylesheet" href="/cristal-assist.css">
  <script src="/cw-auth.js"></script>
  <script src="/admin-auth-guard.js"></script>
  <link rel="stylesheet" href="/crystal-os-v2-foundation.css">
  <link rel="stylesheet" href="/crystal-os-v2-phase2-adapter.css">
  <link rel="stylesheet" href="/ui/design-system.css">
</head>
<body data-required-role="ADMIN">

  <main>
    <section class="finance-shell page" id="extraHistory" data-cw-no-i18n data-cw-form-memory="managed" data-cw-state-managed="manual">
      <header class="card finance-head">
        <div>
          <h1 data-ledger-copy="title">Histórico de extras</h1>
          <p class="text-muted" data-ledger-copy="subtitle">Registos marcados como faturados, com o preço e o cliente guardados na visita.</p>
        </div>
        <div class="finance-nav">
          <a class="cw-v2-btn" href="/admin-master-control" data-ledger-copy="center">Centro</a>
          <a class="cw-v2-btn" href="/invoices" data-ledger-copy="documents">Documentos internos</a>
          <a class="cw-v2-btn" href="/admin-payments" data-ledger-copy="payments">Pagamentos</a>
          <label for="extraLanguage" data-ledger-copy="language">Idioma</label><select id="extraLanguage"><option value="pt">Português</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select>
        </div>
      </header>

      <section class="card">
    <form id="extraFilters" class="finance-toolbar" autocomplete="off" novalidate>
      <div class="finance-filters">
        <label for="extraSearch" data-ledger-copy="search">Pesquisa</label>
        <input id="extraSearch" type="search" maxlength="120">
      </div>
      <div class="finance-filters">
        <label for="extraPoolId" data-ledger-copy="poolId">ID da piscina</label>
        <input id="extraPoolId" inputmode="numeric">
      </div>
      <div class="finance-filters"><label for="extraClientId" data-ledger-copy="clientId">ID do cliente</label><input id="extraClientId" inputmode="numeric"></div>
      <div class="finance-filters"><label for="extraFrom" data-ledger-copy="from">Desde</label><input id="extraFrom" placeholder="YYYY-MM-DD" inputmode="numeric"></div>
      <div class="finance-filters"><label for="extraTo" data-ledger-copy="to">Até</label><input id="extraTo" placeholder="YYYY-MM-DD" inputmode="numeric"></div>
      <button class="cw-v2-btn primary" id="refreshExtras" type="submit" data-ledger-copy="refresh">Atualizar</button>
    </form>
    <p class="text-muted" data-ledger-copy="basis"></p><p class="text-muted" data-ledger-copy="names"></p><p class="text-muted" data-ledger-copy="dateNote"></p>
    <div id="extrasStatus" class="status" role="status" aria-live="polite">A carregar extras…</div>
    <p id="extraChecked" class="text-muted"></p>
    <nav class="extra-pagination"><button id="extraFirst" type="button" data-ledger-copy="first">Primeira página</button><button id="extraPrevious" type="button" data-ledger-copy="previous">Anterior</button><button id="extraNext" type="button" data-ledger-copy="next">Seguinte</button></nav>
    <div id="tableBox" role="list"></div>
    <nav class="extra-pagination"><button id="extraFirstBottom" type="button" data-ledger-copy="first">Primeira página</button><button id="extraPreviousBottom" type="button" data-ledger-copy="previous">Anterior</button><button id="extraNextBottom" type="button" data-ledger-copy="next">Seguinte</button></nav>
      </section>
    </section>
  </main>

  <script src="/cw-extra-history-rules.js"></script>
  <script src="/cw-extra-history-copy.js"></script>
  <script src="/billing-history.js"></script>
<script src="/cristal-help-data.js"></script>
<script src="/cristal-assist.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
<script src="/cw-admin-shortcuts.js"></script>
<script src="/ui/core/navigation-context.js"></script>
  <script src="/crystal-os-v2-shell.js"></script>
  <script src="/crystal-os-v2-nav.js"></script>
  <script defer src="/ui/design-system.js"></script>
</body>
</html>
